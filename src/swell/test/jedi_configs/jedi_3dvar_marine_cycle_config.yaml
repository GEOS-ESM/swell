variational:
  minimizer:
    algorithm: RPCG
  iterations:
  - geometry:
      mom6_input_nml: soca/input.nml
      fields metadata: soca/fields_metadata.yaml
      geom_grid_file: INPUT/soca_gridspec.nc
    gradient norm reduction: 1e-10
    ninner: 10
    diagnostics:
      departures: ombg
    online diagnostics:
      write increment: true
      increment:
        state component:
          datadir: ./
          date: '2021-07-01T09:00:00Z'
          exp: experiment_id
          type: incr
final:
  diagnostics:
    departures: oman
  prints:
    frequency: PT3H
output:
  datadir: ./
  exp: experiment_id
  type: an
