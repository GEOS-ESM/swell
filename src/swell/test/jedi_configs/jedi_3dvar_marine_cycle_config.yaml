cost function:
  cost type: 3D-Var
  jb evaluation: false
  time window:
    begin: '2021-07-01T09:00:00Z'
    end: '2021-07-01T15:00:00Z'
    bound to include: begin
  geometry:
    mom6_input_nml: soca/input.nml
    fields metadata: soca/fields_metadata.yaml
    geom_grid_file: INPUT/soca_gridspec.nc
  analysis variables: &id001
  - sea_water_salinity
  - sea_water_potential_temperature
  - sea_surface_height_above_geoid
  - sea_water_cell_thickness
  background:
    date: '2021-07-01T12:00:00Z'
    read_from_file: 1
    basename: ./
    ocn_filename: MOM6.res.20210701T120000Z.nc
    state variables:
    - sea_water_salinity
    - sea_water_potential_temperature
    - sea_surface_height_above_geoid
    - sea_water_cell_thickness
    - ocean_mixed_layer_thickness
    - sea_water_depth
  background error:
    covariance model: SABER
    saber central block:
      saber block name: diffusion
      active variables:
      - sea_water_potential_temperature
      - sea_water_salinity
      - sea_surface_height_above_geoid
      read:
        groups:
        - variables:
          - sea_water_potential_temperature
          - sea_water_salinity
          horizontal:
            filepath: background_error_model/new_corr_1p0
          vertical:
            levels: 50
            filepath: background_error_model/vt.20210701T120000Z
        - variables:
          - sea_surface_height_above_geoid
          horizontal:
            filepath: background_error_model/new_corr_1p5
    date: '2021-07-01T12:00:00Z'
    saber outer blocks:
    - saber block name: SOCABkgErrFilt
      ocean_depth_min: 100
      rescale_bkgerr: 1.0
      efold_z: 2500.0
    - saber block name: SOCAParametricOceanStdDev
      temperature:
        sst:
          filepath: cycle_dir/soca/godas_sst_bgerr.nc
          variable: sst_bgerr
      unbalanced salinity: {}
      unbalanced ssh: {}
    linear variable change:
      input variables: *id001
      output variables: *id001
      linear variable changes:
      - linear variable change name: BalanceSOCA
        ksshts:
          nlayers: 2
  observations:
    get values:
    observers:
    - obs space:
        name: adt_cryosat2n
        obsdatain:
          engine:
            type: H5File
            obsfile: cycle_dir/adt_cryosat2n.20210701T090000Z.nc4
        obsdataout:
          engine:
            type: H5File
            obsfile: cycle_dir/experiment_id.adt_cryosat2n.20210701T090000Z.nc4
        simulated variables:
        - absoluteDynamicTopography
      obs operator:
        name: ADT
      obs error:
        covariance model: diagonal
      obs filters:
      - filter: Domain Check
        where:
        - variable:
            name: GeoVaLs/sea_area_fraction
          minvalue: 0.9
      - filter: Domain Check
        where:
        - variable:
            name: GeoVaLs/sea_surface_temperature
          minvalue: 7.5
      - filter: Background Check
        absolute threshold: 0.2
      - filter: Domain Check
        where:
        - variable:
            name: GeoVaLs/sea_floor_depth_below_sea_surface
          minvalue: 500
      - filter: Domain Check
        where:
        - variable:
            name: GeoVaLs/distance_from_coast
          minvalue: 100000.0
      observation_name: adt_cryosat2n
    - obs space:
        name: adt_jason3
        obsdatain:
          engine:
            type: H5File
            obsfile: cycle_dir/adt_jason3.20210701T090000Z.nc4
        obsdataout:
          engine:
            type: H5File
            obsfile: cycle_dir/experiment_id.adt_jason3.20210701T090000Z.nc4
        distribution:
          name: Halo
          halo size: 3500000.0
        simulated variables:
        - absoluteDynamicTopography
      obs operator:
        name: ADT
      obs error:
        covariance model: diagonal
      obs filters:
      - filter: Domain Check
        where:
        - variable:
            name: GeoVaLs/sea_area_fraction
          minvalue: 0.9
      - filter: Domain Check
        where:
        - variable:
            name: GeoVaLs/sea_surface_temperature
          minvalue: 7.5
      - filter: Background Check
        absolute threshold: 0.2
      - filter: Domain Check
        where:
        - variable:
            name: GeoVaLs/sea_floor_depth_below_sea_surface
          minvalue: 500
      - filter: Domain Check
        where:
        - variable:
            name: GeoVaLs/distance_from_coast
          minvalue: 100000.0
      obs localizations:
      - localization method: Rossby
        base value: 100000.0
        rossby mult: 1.0
        min grid mult: 2.0
        min value: 200000.0
        max value: 900000.0
      observation_name: adt_jason3
