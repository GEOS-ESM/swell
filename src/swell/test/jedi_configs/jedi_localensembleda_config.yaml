      action:
        name: inflate error
        inflation variable:
          name: ObsFunction/ObsErrorFactorDuplicateCheck
          options:
            use_air_pressure: true
            variable: airTemperature
      defer to post: true
    observation_name: aircraft_temperature
    obs localizations:
    - localization method: Horizontal Gaspari-Cohn
      lengthscale: 1500000.0
      max nobs: 10000
