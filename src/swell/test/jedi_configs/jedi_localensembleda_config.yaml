geometry:
  fms initialization:
    namelist filename: ./fv3-jedi/fv3files/fmsmpp.nml
    field table filename: ./fv3-jedi/fv3files/field_table_gmao
  akbk: ./fv3-jedi/fv3files/akbk72.nc4
  layout:
  - 4
  - 4
  npx: '91'
  npy: '91'
  npz: '72'
time window:
  begin: '2023-10-09T21:00:00Z'
  end: '2023-10-10T03:00:00Z'
  bound to include: begin
increment variables:
- eastward_wind
- northward_wind
- air_temperature
- air_pressure_at_surface
- air_pressure_levels
- water_vapor_mixing_ratio_wrt_moist_air
- cloud_liquid_ice
- cloud_liquid_water
- mole_fraction_of_ozone_in_air
background:
  date: '2023-10-09T21:00:00Z'
  members from template:
    template:
      datetime: '2023-10-10T00:00:00Z'
      filetype: cube sphere history
      provider: geos
      compute edge pressure from surface pressure: true
      max allowable geometry difference: 0.001
      datapath: .
      filenames:
      - ebkg/mem%mem%/geos.mem%mem%.%yyyy%mm%dd_%hh%MM%ssz.nc4
      - fv3-jedi/bkg/geos.crtmsrf.91.nc4
      state variables:
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_at_surface
      - air_pressure_levels
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      - rain_water
      - snow_water
      - mole_fraction_of_ozone_in_air
      - geopotential_at_surface
      - initial_mass_fraction_of_large_scale_cloud_condensate
      - initial_mass_fraction_of_convective_cloud_condensate
      - convective_cloud_area_fraction
      - fraction_of_ocean
      - fraction_of_land
      - isotropic_variance_of_filtered_topography
      - surface_velocity_scale
      - surface_buoyancy_scale
      - planetary_boundary_layer_height
      - surface_exchange_coefficient_for_momentum
      - surface_exchange_coefficient_for_heat
      - surface_exchange_coefficient_for_moisture
      - KCBL_before_moist
      - surface_temp_before_moist
      - lower_index_where_Kh_greater_than_2
      - upper_index_where_Kh_greater_than_2
      - fraction_of_lake
      - fraction_of_ice
      - vtype
      - stype
      - vfrac
      - sheleg
      - skin_temperature_at_surface
      - soilt
      - soilm
      - eastward_wind_at_surface
      - northward_wind_at_surface
      field io names:
        eastward_wind: ua
        northward_wind: va
        air_temperature: t
        air_pressure_at_surface: ps
        air_pressure_levels: pe
        water_vapor_mixing_ratio_wrt_moist_air: q
        cloud_liquid_ice: qi
        cloud_liquid_water: ql
        rain_water: qr
        snow_water: qs
        mole_fraction_of_ozone_in_air: o3ppmv
        geopotential_at_surface: phis
        initial_mass_fraction_of_large_scale_cloud_condensate: qls
        initial_mass_fraction_of_convective_cloud_condensate: qcn
        convective_cloud_area_fraction: cfcn
        fraction_of_ocean: frocean
        fraction_of_land: frland
        isotropic_variance_of_filtered_topography: varflt
        surface_velocity_scale: ustar
        surface_buoyancy_scale: bstar
        planetary_boundary_layer_height: zpbl
        surface_exchange_coefficient_for_momentum: cm
        surface_exchange_coefficient_for_heat: ct
        surface_exchange_coefficient_for_moisture: cq
        KCBL_before_moist: kcbl
        surface_temp_before_moist: tsm
        lower_index_where_Kh_greater_than_2: khl
        upper_index_where_Kh_greater_than_2: khu
        fraction_of_lake: frlake
        fraction_of_ice: frseaice
        skin_temperature_at_surface: ts
        eastward_wind_at_surface: u10m
        northward_wind_at_surface: v10m
    pattern: '%mem%'
    nmembers: 16
    zero padding: 3
observations:
  get values:
    variable change:
      variable change name: Model2GeoVaLs
      hydrometeor effective radii method: gsi
      tropopause pressure method: gsi
  observers:
  - obs space:
      name: Aircraft Temperature
      obsdatain:
        engine:
          type: H5File
          obsfile: cycle_dir/aircraft_temperature.20231009T210000Z.nc4
          missing file action: warn
        obsgrouping:
          group variables:
          - stationIdentification
          - releaseTime
          sort variable: pressure
          sort order: descending
      obsdataout:
        engine:
          type: H5File
          obsfile: cycle_dir/experiment_id.aircraft_temperature.20231009T210000Z.nc4
      io pool:
        max pool size: 6
      simulated variables:
      - airTemperature
      distribution:
        name: Halo
        halo size: 5000000.0
    obs bias:
      input file: cycle_dir/aircraft_temperature.20231009T210000Z.acftbias
      output file: cycle_dir/aircraft_temperature.20231009T210000Z.acftbias
      bc by record: true
      static bc:
        predictors:
        - name: constant
        - name: obsMetadataPredictor
          variable: instantaneousAltitudeRate
        - name: obsMetadataPredictor
          variable: instantaneousAltitudeRate
          order: 2
      covariance:
        minimal required obs number: 3
        variance range:
        - 1e-06
        - 1.0
        step size: 0.0001
        largest analysis variance: 10000.0
        prior:
          input file: cycle_dir/aircraft_temperature.20231009T210000Z.acftbias_cov
          inflation:
            ratio: 1.005
            ratio for small dataset: 2.0
    obs operator:
      name: Composite
      components:
      - name: VertInterp
        observation alias file: experiment_root/experiment_id/configuration/jedi/interfaces/geos_atmosphere/observations/obsop_name_map.yaml
        variables:
        - airTemperature
    linear obs operator:
      name: Composite
      components:
      - name: VertInterp
        observation alias file: experiment_root/experiment_id/configuration/jedi/interfaces/geos_atmosphere/observations/obsop_name_map.yaml
        variables:
        - airTemperature
    obs filters:
    - filter: Variable Assignment
      where:
      - variable:
          name: ObsType/airTemperature
        is_in: 130
      assignments:
      - name: MetaData/stationIdentification
        value: 'KX130   '
    - filter: Variable Assignment
      where:
      - variable:
          name: MetaData/instantaneousAltitudeRate
        minvalue: 50.0
      assignments:
      - name: MetaData/instantaneousAltitudeRate
        value: 0.0
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      action:
        name: assign error
        error parameter: 2.0
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      action:
        name: assign error
        error function:
          name: ObsFunction/ObsErrorModelStepwiseLinear
          options:
            xvar:
              name: MetaData/pressure
            xvals:
            - 100000
            - 95000
            - 90000
            - 85000
            - 80000
            errors:
            - 2.5
            - 2.3
            - 2.1
            - 1.9
            - 1.7
      where:
      - variable:
          name: ObsType/airTemperature
        is_in: 130
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      action:
        name: assign error
        error function:
          name: ObsFunction/ObsErrorModelStepwiseLinear
          options:
            xvar:
              name: MetaData/pressure
            xvals:
            - 100000
            - 95000
            - 90000
            - 85000
            - 80000
            errors:
            - 1.4706
            - 1.3529
            - 1.2353
            - 1.1176
            - 1.0
      where:
      - variable:
          name: ObsType/airTemperature
        is_in: 131,133
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      action:
        name: assign error
        error function:
          name: ObsFunction/ObsErrorModelStepwiseLinear
          options:
            xvar:
              name: MetaData/pressure
            xvals:
            - 105000
            - 100000
            - 95000
            - 90000
            - 85000
            - 70000
            - 65000
            - 60000
            - 40000
            - 35000
            - 30000
            - 25000
            - 20000
            - 5000
            errors:
            - 1.5
            - 1.3
            - 1.1
            - 0.9
            - 0.8
            - 0.8
            - 0.75
            - 0.7
            - 0.7
            - 0.75
            - 0.85
            - 1.3
            - 1.5
            - 1.5
      where:
      - variable:
          name: ObsType/airTemperature
        is_in: 132
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      action:
        name: assign error
        error function:
          name: ObsFunction/ObsErrorModelStepwiseLinear
          options:
            xvar:
              name: MetaData/pressure
            xvals:
            - 100000
            - 95000
            - 90000
            - 85000
            - 80000
            - 60000
            - 40000
            errors:
            - 1.5
            - 1.35
            - 1.25
            - 1.1
            - 1.0
            - 1.3
            - 1.7
      where:
      - variable:
          name: ObsType/airTemperature
        is_in: 134
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      action:
        name: assign error
        error function:
          name: ObsFunction/ObsErrorModelStepwiseLinear
          options:
            xvar:
              name: MetaData/pressure
            xvals:
            - 100000
            - 95000
            - 90000
            - 85000
            - 80000
            errors:
            - 1.4706
            - 1.3529
            - 1.2353
            - 1.1176
            - 1000000000.0
      where:
      - variable:
          name: ObsType/airTemperature
        is_in: 135
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      action:
        name: inflate error
        inflation variable:
          name: ObsFunction/ObsErrorFactorConventional
          options:
            test QCflag: PreQC
            inflate variables:
            - airTemperature
            pressure: MetaData/pressure
            distance threshold: 60000.0
      defer to post: true
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      where:
      - variable: PreQC/airTemperature
        is_in: 4-15
      action:
        name: passivate
      defer to post: true
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      where:
      - variable:
          name: ObsType/airTemperature
        is_in: 134, 135
      action:
        name: passivate
      defer to post: true
    - filter: Perform Action
      action:
        name: inflate error
        inflation factor: 10.0
      filter variables:
      - name: airTemperature
      where:
      - variable:
          name: MetaData/pressure
        maxvalue: 110000
        minvalue: 50000
      - variable:
          name: ObsType/airTemperature
        is_in: 130
      defer to post: true
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      action:
        name: assign error
        error function: GsiAdjustObsError/airTemperature
      where:
      - variable:
          name: GsiAdjustObsError/airTemperature
        value: is_valid
      defer to post: true
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      action:
        name: inflate error
        inflation variable:
          name: ObsFunction/ObsErrorFactorPressureCheck
          options:
            variable: airTemperature
            inflation factor: 8.0
            surface_obs: false
            adjusted_error_name: GsiAdjustObsError
            geovar_sfc_geomz: height_above_mean_sea_level_at_surface
      defer to post: true
    - filter: Variable Assignment
      assignments:
      - name: TempObsErrorData/airTemperature
        type: float
        function:
          name: ObsFunction/Arithmetic
          options:
            variables:
            - name: ObsErrorData/airTemperature
      defer to post: true
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      action:
        name: assign error
        error parameter: 1.3
      where:
      - variable:
          name: TempObsErrorData/airTemperature
        maxvalue: 1.3
      - variable:
          name: TempObsErrorData/airTemperature
        value: is_valid
      defer to post: true
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      action:
        name: assign error
        error parameter: 5.6
      where:
      - variable:
          name: TempObsErrorData/airTemperature
        minvalue: 5.6
      - variable:
          name: TempObsErrorData/airTemperature
        value: is_valid
      defer to post: true
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      where:
      - variable: PreUseFlag/airTemperature
        minvalue: 1
      action:
        name: reject
    - filter: Background Check
      filter variables:
      - name: airTemperature
      threshold: 7.0
      action:
        name: reject
      where:
      - variable: PreQC/airTemperature
        is_not_in:
        - 3
      defer to post: true
    - filter: Background Check
      filter variables:
      - name: airTemperature
      threshold: 4.9
      action:
        name: reject
      where:
      - variable: PreQC/airTemperature
        is_in:
        - 3
      defer to post: true
    - filter: Perform Action
      filter variables:
      - name: airTemperature
      action:
        name: assign error
        error function: TempObsErrorData/airTemperature
      where:
