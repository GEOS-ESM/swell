cost function:
  cost type: 3D-Var
  jb evaluation: false
  time window:
    begin: '2023-08-05T15:00:00Z'
    end: '2023-08-05T21:00:00Z'
    bound to include: begin
  geometry:
    fms initialization:
      namelist filename: cycle_dir/fmsmpp.nml
      field table filename: cycle_dir/field_table_gmao
    akbk: cycle_dir/akbk72.nc4
    layout:
    - 2
    - 2
    npx: 91
    npy: 91
    npz: 72
  analysis variables:
  - volume_mixing_ratio_of_o3
  - volume_mixing_ratio_of_no2
  - volume_mixing_ratio_of_co
  background:
    datetime: '2023-08-05T18:00:00Z'
    filetype: cube sphere history
    provider: geos
    max allowable geometry difference: 0.1
    datapath: cycle_dir
    filename: bkg.%yyyy%mm%ddT%hh%MM%ssZ.nc4
    state variables:
    - air_pressure_thickness
    - air_pressure_at_surface
    - volume_mixing_ratio_of_no2
    - volume_mixing_ratio_of_no
    - volume_mixing_ratio_of_o3
    - volume_mixing_ratio_of_co
    field io names: &id001
      eastward_wind: ua
      northward_wind: va
      air_temperature: T
      air_pressure_at_surface: PS
      air_pressure_thickness: DELP
      volume_mixing_ratio_of_no2: NO2
      volume_mixing_ratio_of_no: "NO"
      volume_mixing_ratio_of_o3: O3
      volume_mixing_ratio_of_co: CO
  background error:
    covariance model: SABER
    saber central block:
      saber block name: BUMP_NICAS
      read:
        io:
          data directory: cycle_dir/
          files prefix: geos_cf
          alias:
          - in code: volume_mixing_ratio_of_o3
            in file: fixedlevel_H_500_300_V_00_03
          - in code: volume_mixing_ratio_of_no2
            in file: fixedlevel_H_500_300_V_00_03
          - in code: volume_mixing_ratio_of_co
            in file: fixedlevel_H_500_300_V_00_03
        drivers:
          multivariate strategy: univariate
          read local nicas: true
    saber outer blocks:
    - saber block name: StdDev
      stddev scale factor: '0.25'
      read:
        model file:
          datetime: '2023-08-05T18:00:00Z'
          set datetime on read: true
          filetype: cube sphere history
          max allowable geometry difference: 0.1
          datapath: cycle_dir
          filename: bkg.%yyyy%mm%ddT%hh%MM%ssZ.nc4
          field io names: *id001
  observations:
    get values:
    observers:
    - obs space:
        name: omps_o3_nm_total
        obsdatain:
          engine:
            type: H5File
            obsfile: cycle_dir/omps_o3_nm_total.20230805T150000Z.nc4
        obsdataout:
          engine:
            type: H5File
            allow overwrite: true
            obsfile: cycle_dir/experiment_id.omps_o3_nm_total.20230805T150000Z.nc4
        simulated variables:
        - ozoneTotal
      obs error:
        covariance model: diagonal
      obs filters:
      - filter: Bounds Check
        filter variables:
        - name: ozoneTotal
        minvalue: 0.0
      - filter: RejectList
        filter variables:
        - name: ozoneTotal
        where:
        - variable:
            name: RetrievalAncillaryData/aprioriTerm
          maxvalue: 0.0
      - filter: RejectList
        filter variables:
        - name: ozoneTotal
        where:
        - variable:
            name: MetaData/qualityFlags
          any_bit_set_of: 0-3
      - filter: RejectList
        filter variables:
        - name: ozoneTotal
        where:
        - variable:
            name: MetaData/groundPixelQualityFlags
          any_bit_unset_of: 8
      obs operator:
        name: ColumnRetrieval
        nlayers_retrieval: 11
        tracer variables:
        - volume_mixing_ratio_of_o3
        isApriori: true
        isAveragingKernel: true
        stretchVertices: topbottom
      observation_name: omps_o3_nm_total
    - obs space:
        name: tropomi_s5p_no2_tropo
        obsdatain:
          engine:
            type: H5File
            obsfile: cycle_dir/tropomi_s5p_no2_tropo.20230805T150000Z.nc4
        obsdataout:
          engine:
            type: H5File
            allow overwrite: true
            obsfile: cycle_dir/experiment_id.tropomi_s5p_no2_tropo.20230805T150000Z.nc4
        simulated variables:
        - nitrogendioxideColumn
        observed variables:
        - nitrogendioxideColumn
      obs filters:
      - filter: Bounds Check
        filter variables:
        - name: nitrogendioxideColumn
        minvalue: 0
      - filter: Domain Check
        filter variables:
        - name: nitrogendioxideColumn
        where:
        - variable:
            name: MetaData/latitude
          minvalue: -65
          maxvalue: 65
      - filter: Bounds Check
        filter variables:
        - name: nitrogendioxideColumn
        test variables:
        - name: RetrievalAncillaryData/averagingKernel
          layers: 1-34
        minvalue: -1.0
        maxvalue: 2.0
        flag all filter variables if any test variable is out of bounds: true
      obs operator:
        name: ColumnRetrieval
        nlayers_retrieval: 34
        tracer variables:
        - volume_mixing_ratio_of_no2
        isApriori: false
        isAveragingKernel: true
        stretchVertices: topbottom
      observation_name: tropomi_s5p_no2_tropo
    - obs space:
        name: tropomi_s5p_co_total
        obsdatain:
          engine:
            type: H5File
            obsfile: cycle_dir/tropomi_s5p_co_total.20230805T150000Z.nc4
        obsdataout:
          engine:
            type: H5File
            allow overwrite: true
            obsfile: cycle_dir/experiment_id.tropomi_s5p_co_total.20230805T150000Z.nc4
        simulated variables:
        - carbonmonoxideTotal
        observed variables:
        - carbonmonoxideTotal
      obs filters:
      - filter: Bounds Check
        filter variables:
        - name: carbonmonoxideTotal
        minvalue: 0
      - filter: Domain Check
        filter variables:
        - name: carbonmonoxideTotal
        where:
        - variable:
            name: MetaData/latitude
          minvalue: -65
          maxvalue: 65
      - filter: Bounds Check
        filter variables:
        - name: carbonmonoxideTotal
        test variables:
        - name: RetrievalAncillaryData/averagingKernel
          layers: 1-50
        minvalue: -1.0
        maxvalue: 2.0
        flag all filter variables if any test variable is out of bounds: true
      - filter: Perform Action
        filter variables:
        - name: carbonmonoxideTotal
        action:
          name: inflate error
          inflation factor: 5.0
      - filter: Variable Assignment
        assignments:
        - name: TempObsErrorData/retrieval_inflated
          type: float
          function:
            name: ObsFunction/Arithmetic
            options:
              variables:
              - name: ObsErrorData/carbonmonoxideTotal
      - filter: Variable Assignment
        assignments:
        - name: TempObsErrorData/fractional_obs_error
          type: float
          function:
            name: ObsFunction/Arithmetic
            options:
              variables:
              - name: ObsValue/carbonmonoxideTotal
              absolute value:
              - true
              total coefficient: 0.1
      - filter: Variable Assignment
        assignments:
        - name: TempObsErrorData/final_obs_error
          type: float
          function:
            name: ObsFunction/Arithmetic
            options:
              variables:
              - name: TempObsErrorData/retrieval_inflated
              - name: TempObsErrorData/fractional_obs_error
              exponents:
              - 2.0
              - 2.0
              coefs:
              - 1.0
              - 1.0
              total exponent: 0.5
      - filter: Perform Action
        filter variables:
        - name: carbonmonoxideTotal
        action:
          name: assign error
          error function:
            name: ObsFunction/Arithmetic
            options:
              variables:
              - name: TempObsErrorData/final_obs_error
      obs operator:
        name: ColumnRetrieval
        nlayers_retrieval: 50
        tracer variables:
        - volume_mixing_ratio_of_co
        isApriori: false
        isAveragingKernel: true
        stretchVertices: topbottom
      observation_name: tropomi_s5p_co_total
variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - geometry:
      fms initialization:
        namelist filename: cycle_dir/fmsmpp.nml
        field table filename: cycle_dir/field_table_gmao
      akbk: cycle_dir/akbk72.nc4
      layout:
      - 2
      - 2
      npx: 91
      npy: 91
      npz: 72
    gradient norm reduction: 1e-10
    ninner: 5
    diagnostics:
      departures: ombg
    online diagnostics:
      write increment: true
      increment:
        state component:
          filetype: auxgrid
          gridtype: latlon
          datapath: ./
          filename: experiment_id.increment-iter1.
          field io names: *id001
final:
  diagnostics:
    departures: oman
  prints:
    frequency: PT3H
  increment:
    geometry:
      fms initialization:
        namelist filename: cycle_dir/fmsmpp.nml
        field table filename: cycle_dir/field_table_gmao
      akbk: cycle_dir/akbk72.nc4
      layout:
      - 2
      - 2
      npx: 91
      npy: 91
      npz: 72
    output:
      state component:
        states:
        - filetype: cube sphere history
          datapath: cycle_dir
          filename: experiment_id.inc.%yyyy%mm%dd_%hh%MM%ssz.nc4
output:
  filetype: cube sphere history
  provider: geos
  datapath: cycle_dir
  filename: experiment_id.analysis.%yyyy%mm%dd_%hh%MM%ssz.nc4
  first: PT0H
  frequency: PT1H
  field io names: *id001
