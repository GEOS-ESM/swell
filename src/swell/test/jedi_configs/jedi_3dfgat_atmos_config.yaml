cost function:
  cost type: 4D-Var
  jb evaluation: false
  time window:
    begin: '2023-10-09T21:00:00Z'
    length: PT6H
    bound to include: begin
  geometry:
    fms initialization:
      namelist filename: ./fv3-jedi/fv3files/fmsmpp.nml
      field table filename: ./fv3-jedi/fv3files/field_table_gmao
    akbk: ./fv3-jedi/fv3files/akbk72.nc4
    layout:
    - 4
    - 4
    npx: '91'
    npy: '91'
    npz: '72'
  model:
    name: PSEUDO
    tstep: PT1H
    filetype: cube sphere history
    provider: geos
    compute edge pressure from surface pressure: true
    max allowable geometry difference: 0.001
    datapath: cycle_dir
    filenames:
    - bkg.%yyyy%mm%ddT%hh%MM%ssZ.nc4
    - fv3-jedi/bkg/geos.crtmsrf.91.nc4
    field io names: &id001
      eastward_wind: ua
      northward_wind: va
      air_temperature: t
      air_pressure_at_surface: ps
      air_pressure_levels: pe
      water_vapor_mixing_ratio_wrt_moist_air: q
      cloud_liquid_ice: qi
      cloud_liquid_water: ql
      rain_water: qr
      snow_water: qs
      mole_fraction_of_ozone_in_air: o3ppmv
      geopotential_at_surface: phis
      initial_mass_fraction_of_large_scale_cloud_condensate: qls
      initial_mass_fraction_of_convective_cloud_condensate: qcn
      convective_cloud_area_fraction: cfcn
      fraction_of_ocean: frocean
      fraction_of_land: frland
      isotropic_variance_of_filtered_topography: varflt
      surface_velocity_scale: ustar
      surface_buoyancy_scale: bstar
      planetary_boundary_layer_height: zpbl
      surface_exchange_coefficient_for_momentum: cm
      surface_exchange_coefficient_for_heat: ct
      surface_exchange_coefficient_for_moisture: cq
      KCBL_before_moist: kcbl
      surface_temp_before_moist: tsm
      lower_index_where_Kh_greater_than_2: khl
      upper_index_where_Kh_greater_than_2: khu
      fraction_of_lake: frlake
      fraction_of_ice: frseaice
      skin_temperature_at_surface: ts
      eastward_wind_at_surface: u10m
      northward_wind_at_surface: v10m
  variable change:
    variable change name: Analysis2Model
  forecast length: PT6H
  analysis variables: &id003
  - eastward_wind
  - northward_wind
  - air_temperature
  - water_vapor_mixing_ratio_wrt_moist_air
  - air_pressure_at_surface
  - air_pressure_levels
  - cloud_liquid_ice
  - cloud_liquid_water
  - rain_water
  - snow_water
  - mole_fraction_of_ozone_in_air
  - geopotential_at_surface
  - fraction_of_ocean
  - fraction_of_lake
  - fraction_of_ice
  - skin_temperature_at_surface
  background:
    datetime: '2023-10-09T21:00:00Z'
    filetype: cube sphere history
    provider: geos
    compute edge pressure from surface pressure: true
    max allowable geometry difference: 0.001
    datapath: cycle_dir
    filenames:
    - bkg.%yyyy%mm%ddT%hh%MM%ssZ.nc4
    - fv3-jedi/bkg/geos.crtmsrf.91.nc4
    state variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_at_surface
    - air_pressure_levels
    - water_vapor_mixing_ratio_wrt_moist_air
    - cloud_liquid_ice
    - cloud_liquid_water
    - rain_water
    - snow_water
    - mole_fraction_of_ozone_in_air
    - geopotential_at_surface
    - initial_mass_fraction_of_large_scale_cloud_condensate
    - initial_mass_fraction_of_convective_cloud_condensate
    - convective_cloud_area_fraction
    - fraction_of_ocean
    - fraction_of_land
    - isotropic_variance_of_filtered_topography
    - surface_velocity_scale
    - surface_buoyancy_scale
    - planetary_boundary_layer_height
    - surface_exchange_coefficient_for_momentum
    - surface_exchange_coefficient_for_heat
    - surface_exchange_coefficient_for_moisture
    - KCBL_before_moist
    - surface_temp_before_moist
    - lower_index_where_Kh_greater_than_2
    - upper_index_where_Kh_greater_than_2
    - fraction_of_lake
    - fraction_of_ice
    - vtype
    - stype
    - vfrac
    - sheleg
    - skin_temperature_at_surface
    - soilt
    - soilm
    - eastward_wind_at_surface
    - northward_wind_at_surface
    field io names: *id001
  background error:
    covariance model: SABER
    covariance type: gsi hybrid covariance
    saber central block:
      saber block name: gsi hybrid covariance
      read:
        gsi akbk: ./fv3-jedi/fv3files/akbk72.nc4
        gsi error covariance file: ./fv3-jedi/gsibec/gsi-coeffs-gmao-global-l72x144y91.nc4
        gsi berror namelist file: ./fv3-jedi/gsibec/cli_gsibec_configuration_l72x144y91.nml
        processor layout x direction: 4
        processor layout y direction: 24
        debugging mode: false
    saber outer blocks:
    - saber block name: interpolation
      inner geometry:
        function space: StructuredColumns
        custom grid matching gsi:
          type: latlon
          lats: 91
          lons: 144
        custom partitioner matching gsi:
          bands: 24
        halo: 1
      forward interpolator:
        local interpolator type: oops unstructured grid interpolator
      inverse interpolator:
        local interpolator type: oops unstructured grid interpolator
      state variables to inverse: &id002
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_at_surface
      - air_pressure_levels
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      - rain_water
      - snow_water
      - mole_fraction_of_ozone_in_air
      - fraction_of_ocean
      - fraction_of_lake
      - fraction_of_ice
      - geopotential_at_surface
      - skin_temperature_at_surface
    linear variable change:
      linear variable change name: Control2Analysis
      input variables: *id002
      output variables: *id003
  observations:
    get values:
      variable change:
        variable change name: Model2GeoVaLs
        hydrometeor effective radii method: gsi
        tropopause pressure method: gsi
    observers:
    - obs space:
        name: ABI GOES-16
        obsdatain:
          engine:
            type: H5File
            obsfile: cycle_dir/abi_g16.20231009T210000Z.nc4
            missing file action: warn
        obsdataout:
          engine:
            type: H5File
            obsfile: cycle_dir/experiment_id.abi_g16.20231009T210000Z.nc4
        io pool:
          max pool size: 6
        simulated variables:
        - brightnessTemperature
        channels: None
      obs operator:
        name: CRTM
        Absorbers:
        - H2O
        - O3
        - CO2
        obs options:
          Sensor_ID: abi_g16
          EndianType: little_endian
          CoefficientPath: /discover/nobackup/projects/gmao/advda/SwellStaticFiles/jedi/crtm_coefficients/2.4.1-1//
        linear obs operator:
          Absorbers:
          - H2O
          - O3
          Surfaces:
          - Water_Temperature
          - Land_Temperature
          - Ice_Temperature
          - Snow_Temperature
          zeroO3JacRange:
          - 996.0
          - 1170.0
      obs bias:
        input file: cycle_dir/abi_g16.20231009T150000Z.satbias.nc4
        output file: cycle_dir/abi_g16.20231009T210000Z.satbias.nc4
        variational bc:
          predictors:
          - name: constant
          - name: lapseRate
            order: 2
            tlapse: cycle_dir/abi_g16.20231009T150000Z.tlapse.txt
          - name: lapseRate
            tlapse: cycle_dir/abi_g16.20231009T150000Z.tlapse.txt
          - name: emissivityJacobian
          - name: sensorScanAngle
            var_name: sensorScanPosition
            order: 4
          - name: sensorScanAngle
            var_name: sensorScanPosition
            order: 3
          - name: sensorScanAngle
            var_name: sensorScanPosition
            order: 2
          - name: sensorScanAngle
            var_name: sensorScanPosition
        covariance:
          minimal required obs number: 20
          variance range:
          - 1e-06
          - 10.0
          step size: 0.0001
          largest analysis variance: 10000.0
          prior:
            input file: cycle_dir/abi_g16.20231009T150000Z.satbias_cov.nc4
