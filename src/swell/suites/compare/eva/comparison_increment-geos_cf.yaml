datasets:

- group: increment
  type: LatLon
  filename: {{increment_file_path_exp}}
  name: experiment_increment_exp
  variables: [NO2, lat, lon]

- group: increment
  type: LatLon
  filename: {{increment_file_path_ctl}}
  name: experiment_increment_ctl
  variables: [NO2, lat, lon]

graphics:

  plotting_backend: Emcpy
  figure_list:

  #map plot for NO2 increment (near surface)
  - batch figure:
      variables: [NO2]
    figure:
      figure size: [60,30]
      layout: [3,1]
      title: 'NO2 Increment from JEDI'
      output name: '{{cycle_dir}}/eva/increment/map_plots/${variable}/inc_${variable}_surface.png'
      tight_layout: true 
    plots:
      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: NO2 Increment
        add_grid:
        add_title: '{{experiment_tag_exp}}'
        layers:
        - type: MapGridded
          longitude:
            variable: experiment_increment_exp::increment::lon
          latitude:
            variable: experiment_increment_exp::increment::lat
          data:
            variable: experiment_increment_exp::increment::NO2
            slices: '[71,...]'
          label: "{{experiment_tag_exp}} NO2 increment (surface level)"
          colorbar: true
          cmap: 'bwr'
          vmin: -1e-10
          vmax: 1e-10

      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: NO2 Increment
        add_grid:
        add_title: '{{experiment_tag_ctl}}'
        layers:
        - type: MapGridded
          longitude:
            variable: experiment_increment_ctl::increment::lon
          latitude:
            variable: experiment_increment_ctl::increment::lat
          data:
            variable: experiment_increment_ctl::increment::NO2
            slices: '[71,...]'
          label: "{{experiment_tag_ctl}} NO2 increment (surface level)"
          colorbar: true
          cmap: 'bwr'
          vmin: -1e-10
          vmax: 1e-10

      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: NO2 Increment
        add_grid:
        add_title: '{{experiment_tag_exp}} - {{experiment_tag_ctl}}'
        layers:
        - type: MapGridded
          longitude:
            variable: experiment_increment_exp::increment::lon
          latitude:
            variable: experiment_increment_exp::increment::lat
          data:
            variable: experiment_increment_exp::increment::NO2_diff
            slices: '[71,...]'
          label: "{{experiment_tag_exp}} NO2 increment diff (surface level)"
          colorbar: true
          cmap: 'bwr'
          vmin: -1e-11
          vmax: 1e-11

transforms:
- equals: experiment_increment_exp::increment::NO2-experiment_increment_ctl::increment::NO2
  for:
    variable: NO2
  new name: experiment_increment_exp::increment::NO2_diff
  transform: arithmetic
