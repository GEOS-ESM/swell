        layers:
        - type: MapScatter
          longitude:
            variable: experiment_exp::MetaData::longitude
          latitude:
            variable: experiment_exp::MetaData::latitude
          data:
            variable: experiment_exp::Hofx0MinusGsiHofXBc::${variable}
