datasets:

- name: experiment_exp
  type: IodaObsSpace
  filenames:
    - {{obs_path_file_exp}}
  channels: &channels {{channels}}
  groups:
    - name: ObsValue
      variables: &variables {{simulated_variables}}
    - name: GsiHofXBc
    #- name: GsiEffectiveQC
    - name: hofx0
    - name: hofx1
    - name: ombg
    - name: oman
    - name: EffectiveQC0
    - name: EffectiveQC1
    - name: MetaData

- name: experiment_ctl
  type: IodaObsSpace
  filenames:
    - {{obs_path_file_ctl}}
  channels: *channels
  groups:
    - name: ObsValue
      variables: *variables
    - name: GsiHofXBc
    #- name: GsiEffectiveQC
    - name: hofx0
    - name: hofx1
    - name: ombg
    - name: oman
    - name: EffectiveQC0
    - name: EffectiveQC1
    - name: MetaData

transforms:

# Generate hofx0 for GSI 1
- transform: arithmetic
  new name: experiment_exp::ObsValueMinusGsiHofXBc::${variable}
  equals: experiment_exp::ObsValue::${variable}-experiment_exp::GsiHofXBc::${variable}
  for:
    variable: *variables

# Generate hofx0 for GSI 2
- transform: arithmetic
  new name: experiment_ctl::ObsValueMinusGsiHofXBc::${variable}
  equals: experiment_ctl::ObsValue::${variable}-experiment_ctl::GsiHofXBc::${variable}
  for:
    variable: *variables

# Generate hofx0 for JEDI 1
- transform: arithmetic
  new name: experiment_exp::ObsValueMinusHofx0::${variable}
  equals: experiment_exp::ObsValue::${variable}-experiment_exp::hofx0::${variable}
  for:
    variable: *variables

# Generate hofx0 for JEDI 2
- transform: arithmetic
  new name: experiment_ctl::ObsValueMinusHofx0::${variable}
  equals: experiment_ctl::ObsValue::${variable}-experiment_ctl::hofx0::${variable}
  for:
    variable: *variables

# Generate hofx difference 1
- transform: arithmetic
  new name: experiment_exp::Hofx0MinusGsiHofXBc::${variable}
  equals: experiment_exp::hofx0::${variable}-experiment_exp::GsiHofXBc::${variable}
  for:
    variable: *variables

# Generate hofx difference 2
- transform: arithmetic
  new name: experiment_ctl::Hofx0MinusGsiHofXBc::${variable}
  equals: experiment_ctl::hofx0::${variable}-experiment_ctl::GsiHofXBc::${variable}
  for:
    variable: *variables

# Generate hofx that passed QC for JEDI 1
- transform: accept where
  new name: experiment_exp::hofx0PassedQc::${variable}
  starting field: experiment_exp::hofx0::${variable}
  where:
    - experiment_exp::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate hofx that passed QC for JEDI 2
- transform: accept where
  new name: experiment_ctl::hofx0PassedQc::${variable}
  starting field: experiment_ctl::hofx0::${variable}
  where:
    - experiment_ctl::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate GSI hofx that passed JEDI QC 1
- transform: accept where
  new name: experiment_exp::GsiHofXBcPassedQc::${variable}
  starting field: experiment_exp::GsiHofXBc::${variable}
  where:
    - experiment_exp::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate GSI hofx that passed JEDI QC 2
- transform: accept where
  new name: experiment_ctl::GsiHofXBcPassedQc::${variable}
  starting field: experiment_ctl::GsiHofXBc::${variable}
  where:
    - experiment_ctl::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate hofx0 that passed QC for JEDI 1
- transform: accept where
  new name: experiment_exp::ObsValueMinushofx0PassedQc::${variable}
  starting field: experiment_exp::ObsValueMinusHofx0::${variable}
  where:
    - experiment_exp::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate hofx0 that passed QC for JEDI 2
- transform: accept where
  new name: experiment_ctl::ObsValueMinushofx0PassedQc::${variable}
  starting field: experiment_ctl::ObsValueMinusHofx0::${variable}
  where:
    - experiment_ctl::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate hofx0 that passed QC for GSI 1
- transform: accept where
  new name: experiment_exp::ObsValueMinusGsiHofXBcPassedQc::${variable}
  starting field: experiment_exp::ObsValueMinusGsiHofXBc::${variable}
  where:
    - experiment_exp::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate hofx0 that passed QC for GSI 2
- transform: accept where
  new name: experiment_ctl::ObsValueMinusGsiHofXBcPassedQc::${variable}
  starting field: experiment_ctl::ObsValueMinusGsiHofXBc::${variable}
  where:
    - experiment_ctl::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate ombg that passed QC for JEDI 1
- transform: accept where
  new name: experiment_exp::ombgPassedQc::${variable}
  starting field: experiment_exp::ombg::${variable}
  where:
    - experiment_exp::EffectiveQC0::${variable} == 0
  for:
    variable: *variables
    
# Generate ombg that passed QC for JEDI 2
- transform: accept where
  new name: experiment_ctl::ombgPassedQc::${variable}
  starting field: experiment_ctl::ombg::${variable}
  where:
    - experiment_ctl::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate oman that passed QC for JEDI 1
- transform: accept where
  new name: experiment_exp::omanPassedQc::${variable}
  starting field: experiment_exp::oman::${variable}
  where:
    - experiment_exp::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate oman that passed QC for JEDI 2
- transform: accept where
  new name: experiment_ctl::omanPassedQc::${variable}
  starting field: experiment_ctl::oman::${variable}
  where:
    - experiment_ctl::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate obs contribution to analysis (OmA*OmA)-(OmB*OmB) 1
- transform: arithmetic
  new name: experiment_exp::ResidualRMSdiff::${variable}
  equals: (experiment_exp::omanPassedQc::${variable})*(experiment_exp::omanPassedQc::${variable})-(experiment_exp::ombgPassedQc::${variable})*(experiment_exp::ombgPassedQc::${variable})
  for:
    variable: *variables

# Generate obs contribution to analysis (OmA*OmA)-(OmB*OmB) 2
- transform: arithmetic
  new name: experiment_ctl::ResidualRMSdiff::${variable}
  equals: (experiment_ctl::omanPassedQc::${variable})*(experiment_ctl::omanPassedQc::${variable})-(experiment_ctl::ombgPassedQc::${variable})*(experiment_ctl::ombgPassedQc::${variable})
  for:    
    variable: *variables

graphics:

  plotting_backend: Emcpy
  figure_list:

  # Correlation scatter plots
  # -------------------------

  # JEDI h(x) vs Observations
  - batch figure:
      variables: *variables
      channels: *channels
    figure:
      layout: [2,1]
      figure size: [20, 10]
      title: 'Observations vs. JEDI h(x) | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/correlation_scatter/${variable}${channel}/jedi_hofx0_vs_obs_{{instrument}}_${variable}${channel}.png'
    plots:
      - add_xlabel: 'Observation Value'
        add_ylabel: 'JEDI h(x)'
        add_grid:
        add_title: '({{experiment_tag_exp}}) {{experiment_id_exp}}'
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_exp::ObsValue::${variable}
          y:
            variable: experiment_exp::hofx0::${variable}
          channel: ${channel}
          markersize: 5
          color: 'black'
          label: 'JEDI h(x) versus obs (all obs)'
        - type: Scatter
          x:
            variable: experiment_exp::ObsValue::${variable}
          y:
            variable: experiment_exp::hofx0PassedQc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'red'
          label: 'JEDI h(x) versus obs (passed QC in JEDI)'

      - add_xlabel: 'Observation Value'
        add_ylabel: 'JEDI h(x)'
        add_grid:
        add_title: '({{experiment_tag_ctl}}) {{experiment_id_ctl}}'
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_ctl::ObsValue::${variable}
          y:
            variable: experiment_ctl::hofx0::${variable}
          channel: ${channel}
