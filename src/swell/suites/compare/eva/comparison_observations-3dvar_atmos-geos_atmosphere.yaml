# Map plots# ---------

  # Observations
  - batch figure:
      variables: *variables
      channels: *channels
    dynamic options:
      - type: vminvmaxcmap
        channel: ${channel}
        data variable: experiment_exp::ObsValue::${variable}
    figure:
      figure size: [40,10]
      layout: [2,1]
      title: 'Observations | {{instrument_title}} | Obs Value'
      output name: '{{cycle_dir}}/eva/{{instrument}}/map_plots/${variable}${channel}/observations_{{instrument}}_${variable}${channel}.png'
    plots:
      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: ObsValue
        add_grid:
        add_title: "({{experiment_tag_exp}}) {{experiment_id_exp}}"
        layers:
        - type: MapScatter
          longitude:
            variable: experiment_exp::MetaData::longitude
          latitude:
            variable: experiment_exp::MetaData::latitude
          data:
            variable: experiment_exp::ObsValue::${variable}
            channel: ${channel}
          markersize: 2
          label: ObsValue
          colorbar: true
          cmap: ${dynamic_cmap}
          vmin: ${dynamic_vmin}
          vmax: ${dynamic_vmax}

