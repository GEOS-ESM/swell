  # JEDI oma vs omb
  - batch figure:
      variables: *variables
      channels: *channels
    figure:
      layout: [2,1]
      title: 'OmA vs. OmB | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/correlation_scatter/${variable}${channel}/jedi_oma_vs_omb_{{instrument}}_${variable}${channel}.png'
    plots:
      - add_xlabel: 'OmA'
        add_ylabel: 'OmB'
        add_title: '{{experiment_id_1}} (1)'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_1::oman::${variable}
          y:
            variable: experiment_1::ombg::${variable}
          channel: ${channel}
          markersize: 5
          color: 'black'
          label: 'OmA versus OmB (all residuals)'
        - type: Scatter
          x:
            variable: experiment_1::omanPassedQc::${variable}
          y:
            variable: experiment_1::ombgPassedQc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'red'
          label: 'OmA versus OmB (passed QC)'

      - add_xlabel: 'OmA'
        add_ylabel: 'OmB'
        add_title: '{{experiment_id_2}} (2)'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_2::oman::${variable}
          y:
            variable: experiment_2::ombg::${variable}
