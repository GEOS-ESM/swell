            variable: experiment_2::omanPassedQc::${variable}
          y:
            variable: experiment_2::ombgPassedQc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'red'
          label: 'OmA versus OmB (passed QC)'

  # JediFinalObsError vs GsiObsFinalObsError
  - batch figure:
      variables: *variables
      channels: *channels
    figure:
      layout: [2,1]
      title: 'Jedi ObsError vs. GSI ObsError | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/correlation_scatter/${variable}${channel}/JediObsError_vs_GsiObsError_{{instrument}}_${variable}${channel}.png'
    plots:
      - add_xlabel: 'GsiFinalObsError'
        add_ylabel: 'JediFinalObsError'
        add_title: '{{experiment_id_1}} (1)'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_1::GsiFinalObsError::${variable}
          y:
            variable: experiment_1::EffectiveError1::${variable}
          channel: ${channel}
          markersize: 5
          color: 'black'
          label: 'JediObsError versus GsiObsError (all residuals)'
        - type: Scatter
          x:
            variable: experiment_1::GsiFinalObsErrorPassedQc::${variable}
          y:
            variable: experiment_1::JediFinalObsErrorPassedQc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'red'
          label: 'JediObsError versus GsiObsError (passed Jedi QC)'

      - add_xlabel: 'GsiFinalObsError'
        add_ylabel: 'JediFinalObsError'
