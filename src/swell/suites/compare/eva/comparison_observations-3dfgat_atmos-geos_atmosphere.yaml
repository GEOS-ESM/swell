          x:
            variable: experiment_2::ObsValueMinusGsiHofXBc::${variable}
          y:
            variable: experiment_2::ObsValueMinusHofx0::${variable}
          channel: ${channel}
          markersize: 5
          color: 'black'
          label: 'GSI hofx0 vs JEDI hofx0 (all obs)'
        - type: Scatter
          x:
            variable: experiment_2::ObsValueMinusGsiHofXBcPassedQc::${variable}
          y:
            variable: experiment_2::ObsValueMinushofx0PassedQc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'red'
          label: 'GSI hofx0 vs JEDI hofx0 (passed QC in JEDI)'

  # JEDI-GSI hofx0 differences vs GSI Obs-hofx0
  - batch figure:
      variables: *variables
      channels: *channels
    figure:
      layout: [2,1]
      title: 'hofx0 difference vs. GSI Obs-hofx0 | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/correlation_scatter/${variable}${channel}/gsi_hofx0_vs_jedi_hofx0_diff_{{instrument}}_${variable}${channel}.png'
    plots:
      - add_xlabel: 'GSI observation minus h(x)'
        add_ylabel: 'JEDI h(x) minus GSI h(x)'
        add_title: '{{experiment_id_1}} (1)'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_1::ObsValueMinusGsiHofXBcPassedGsiQc::${variable}
          y:
            variable: experiment_1::Hofx0MinusGsiHofXBcPassedGsiQc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'red'
          label: '(JEDI hofx0 - GSI hofx0) vs GSI Obs-hofx0 (passed GSI QC)'

      - add_xlabel: 'GSI observation minus h(x)'
        add_ylabel: 'JEDI h(x) minus GSI h(x)'
        add_title: '{{experiment_id_2}} (2)'
