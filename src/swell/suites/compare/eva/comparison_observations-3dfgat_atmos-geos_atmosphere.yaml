datasets:

- name: experiment_1
  type: IodaObsSpace
  filenames:
    - {{obs_path_file_1}}
  channels: &channels {{channels}}
  groups:
    - name: ObsValue
      variables: &variables {{simulated_variables}}
    - name: GsiHofXBc
    - name: GsiEffectiveQC
    - name: hofx0
    - name: hofx1
    - name: ombg
    - name: oman
    - name: EffectiveQC0
    - name: EffectiveQC1
    - name: MetaData
    - name: GsiFinalObsError
    - name: EffectiveError1

- name: experiment_2
  type: IodaObsSpace
  filenames:
    - {{obs_path_file_2}}
  channels: *channels
  groups:
    - name: ObsValue
      variables: *variables
    - name: GsiHofXBc
    - name: GsiEffectiveQC
    - name: hofx0
    - name: hofx1
    - name: ombg
    - name: oman
    - name: EffectiveQC0
    - name: EffectiveQC1
    - name: MetaData
    - name: GsiFinalObsError
    - name: EffectiveError1

transforms:

# Generate hofx0 for GSI 1
- transform: arithmetic
  new name: experiment_1::ObsValueMinusGsiHofXBc::${variable}
  equals: experiment_1::ObsValue::${variable}-experiment_1::GsiHofXBc::${variable}
  for:
    variable: *variables

# Generate hofx0 for GSI 2
- transform: arithmetic
  new name: experiment_2::ObsValueMinusGsiHofXBc::${variable}
  equals: experiment_2::ObsValue::${variable}-experiment_2::GsiHofXBc::${variable}
  for:
    variable: *variables

# Generate hofx0 for JEDI 1
- transform: arithmetic
  new name: experiment_1::ObsValueMinusHofx0::${variable}
  equals: experiment_1::ObsValue::${variable}-experiment_1::hofx0::${variable}
  for:
    variable: *variables

# Generate hofx0 for JEDI 2
- transform: arithmetic
  new name: experiment_2::ObsValueMinusHofx0::${variable}
  equals: experiment_2::ObsValue::${variable}-experiment_2::hofx0::${variable}
  for:
    variable: *variables

# Generate hofx difference 1
- transform: arithmetic
  new name: experiment_1::Hofx0MinusGsiHofXBc::${variable}
  equals: experiment_1::hofx0::${variable}-experiment_1::GsiHofXBc::${variable}
  for:
    variable: *variables

# Generate hofx difference 2
- transform: arithmetic
  new name: experiment_2::Hofx0MinusGsiHofXBc::${variable}
  equals: experiment_2::hofx0::${variable}-experiment_2::GsiHofXBc::${variable}
  for:
    variable: *variables

# Generate hofx that passed QC for JEDI 1
- transform: accept where
  new name: experiment_1::hofx0PassedQc::${variable}
  starting field: experiment_1::hofx0::${variable}
  where:
    - experiment_1::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate hofx that passed QC for JEDI 2
- transform: accept where
  new name: experiment_2::hofx0PassedQc::${variable}
  starting field: experiment_2::hofx0::${variable}
  where:
    - experiment_2::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate GSI hofx that passed JEDI QC 1
- transform: accept where
  new name: experiment_1::GsiHofXBcPassedQc::${variable}
  starting field: experiment_1::GsiHofXBc::${variable}
  where:
    - experiment_1::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate GSI hofx that passed JEDI QC 2
- transform: accept where
  new name: experiment_2::GsiHofXBcPassedQc::${variable}
  starting field: experiment_2::GsiHofXBc::${variable}
  where:
    - experiment_2::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate hofx0 that passed QC for JEDI 1
- transform: accept where
  new name: experiment_1::ObsValueMinushofx0PassedQc::${variable}
  starting field: experiment_1::ObsValueMinusHofx0::${variable}
  where:
    - experiment_1::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate hofx0 that passed QC for JEDI 2
- transform: accept where
  new name: experiment_2::ObsValueMinushofx0PassedQc::${variable}
  starting field: experiment_2::ObsValueMinusHofx0::${variable}
  where:
    - experiment_2::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate hofx difference passed GSI QC 1
- transform: accept where
  new name: experiment_1::Hofx0MinusGsiHofXBcPassedGsiQc::${variable}
  starting field: experiment_1::Hofx0MinusGsiHofXBc::${variable}
  where:
    - experiment_1::GsiEffectiveQC::${variable} == 0
  for:
    variable: *variables

# Generate hofx difference passed GSI QC 2
- transform: accept where
  new name: experiment_2::Hofx0MinusGsiHofXBcPassedGsiQc::${variable}
  starting field: experiment_2::Hofx0MinusGsiHofXBc::${variable}
  where:
    - experiment_2::GsiEffectiveQC::${variable} == 0
  for:
    variable: *variables

# Generate GSI OmF passed GSI QC 1
- transform: accept where
  new name: experiment_1::ObsValueMinusGsiHofXBcPassedGsiQc::${variable}
  starting field: experiment_1::ObsValueMinusGsiHofXBc::${variable}
  where:
    - experiment_1::GsiEffectiveQC::${variable} == 0
  for:
    variable: *variables

# Generate GSI OmF passed GSI QC 2
- transform: accept where
  new name: experiment_2::ObsValueMinusGsiHofXBcPassedGsiQc::${variable}
  starting field: experiment_2::ObsValueMinusGsiHofXBc::${variable}
  where:
    - experiment_2::GsiEffectiveQC::${variable} == 0
  for:
    variable: *variables

# Generate hofx0 that passed QC for GSI 1
- transform: accept where
  new name: experiment_1::ObsValueMinusGsiHofXBcPassedQc::${variable}
  starting field: experiment_1::ObsValueMinusGsiHofXBc::${variable}
  where:
    - experiment_1::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate hofx0 that passed QC for GSI 2
- transform: accept where
  new name: experiment_2::ObsValueMinusGsiHofXBcPassedQc::${variable}
  starting field: experiment_2::ObsValueMinusGsiHofXBc::${variable}
  where:
    - experiment_2::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate ombg that passed QC for JEDI 1
- transform: accept where
  new name: experiment_1::ombgPassedQc::${variable}
  starting field: experiment_1::ombg::${variable}
  where:
    - experiment_1::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate ombg that passed QC for JEDI 2
- transform: accept where
  new name: experiment_2::ombgPassedQc::${variable}
  starting field: experiment_2::ombg::${variable}
  where:
    - experiment_2::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate oman that passed QC for JEDI 1
- transform: accept where
  new name: experiment_1::omanPassedQc::${variable}
  starting field: experiment_1::oman::${variable}
  where:
    - experiment_1::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate oman that passed QC for JEDI 2
- transform: accept where
  new name: experiment_2::omanPassedQc::${variable}
  starting field: experiment_2::oman::${variable}
  where:
    - experiment_2::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate jedi final obserror that passed JEDI QC 1
- transform: accept where
  new name: experiment_1::JediFinalObsErrorPassedQc::${variable}
  starting field: experiment_1::EffectiveError1::${variable}
  where:
    - experiment_1::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate jedi final obserror that passed JEDI QC 2
- transform: accept where
  new name: experiment_2::JediFinalObsErrorPassedQc::${variable}
  starting field: experiment_2::EffectiveError1::${variable}
  where:
    - experiment_2::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate GSI final obserror that passed JEDI QC 1
- transform: accept where
  new name: experiment_1::GsiFinalObsErrorPassedQc::${variable}
  starting field: experiment_1::GsiFinalObsError::${variable}
  where:
    - experiment_1::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate GSI final obserror that passed JEDI QC 2
- transform: accept where
  new name: experiment_2::GsiFinalObsErrorPassedQc::${variable}
  starting field: experiment_2::GsiFinalObsError::${variable}
  where:
    - experiment_2::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate jedi final obserror that passed GSI QC 1
- transform: accept where
  new name: experiment_1::JediFinalObsErrorPassedGsiQc::${variable}
  starting field: experiment_1::EffectiveError1::${variable}
  where:
    - experiment_1::GsiEffectiveQC::${variable} == 0
  for:
    variable: *variables

# Generate jedi final obserror that passed GSI QC 2
- transform: accept where
  new name: experiment_2::JediFinalObsErrorPassedGsiQc::${variable}
  starting field: experiment_2::EffectiveError1::${variable}
  where:
    - experiment_2::GsiEffectiveQC::${variable} == 0
  for:
    variable: *variables

# Generate jedi final obserror that passed GSI QC 1
- transform: accept where
  new name: experiment_1::GsiFinalObsErrorPassedGsiQc::${variable}
  starting field: experiment_1::GsiFinalObsError::${variable}
  where:
    - experiment_1::GsiEffectiveQC::${variable} == 0
  for:
    variable: *variables

# Generate jedi final obserror that passed GSI QC 2
- transform: accept where
  new name: experiment_2::GsiFinalObsErrorPassedGsiQc::${variable}
  starting field: experiment_2::GsiFinalObsError::${variable}
  where:
    - experiment_2::GsiEffectiveQC::${variable} == 0
  for:
    variable: *variables

# Generate obs contribution to analysis (OmA*OmA)-(OmB*OmB) 1
- transform: arithmetic
  new name: experiment_1::ResidualRMSdiff::${variable}
  equals: (experiment_1::omanPassedQc::${variable})*(experiment_1::omanPassedQc::${variable})-(experiment_1::ombgPassedQc::${variable})*(experiment_1::ombgPassedQc::${variable})
  for:
    variable: *variables

# Generate obs contribution to analysis (OmA*OmA)-(OmB*OmB) 2
- transform: arithmetic
  new name: experiment_2::ResidualRMSdiff::${variable}
  equals: (experiment_2::omanPassedQc::${variable})*(experiment_2::omanPassedQc::${variable})-(experiment_2::ombgPassedQc::${variable})*(experiment_2::ombgPassedQc::${variable})
  for:
    variable: *variables

graphics:

  plotting_backend: Emcpy
  figure_list:

  # Correlation scatter plots
  # -------------------------

  # JEDI h(x) vs Observations
  - batch figure:
      variables: *variables
      channels: *channels
    figure:
      layout: [3,1]
      title: 'Observations vs. JEDI h(x) | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/correlation_scatter/${variable}${channel}/jedi_hofx0_vs_obs_{{instrument}}_${variable}${channel}.png'
    plots:
      - add_xlabel: 'Observation Value'
        add_ylabel: 'JEDI h(x)'
        add_title: '{{experiment_id_1}} (1)'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_1::ObsValue::${variable}
          y:
            variable: experiment_1::hofx0::${variable}
          channel: ${channel}
          markersize: 5
          color: 'black'
          label: 'JEDI h(x) versus obs (all obs)'
        - type: Scatter
          x:
            variable: experiment_1::ObsValue::${variable}
          y:
            variable: experiment_1::hofx0PassedQc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'red'
          label: 'JEDI h(x) versus obs (passed QC in JEDI)'

      - add_xlabel: 'Observation Value'
        add_ylabel: 'JEDI h(x)'
        add_title: '{{experiment_id_2}} (2)'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_2::ObsValue::${variable}
          y:
            variable: experiment_2::hofx0::${variable}
          channel: ${channel}
          markersize: 5
          color: 'black'
          label: 'JEDI h(x) versus obs (all obs)'
        - type: Scatter
          x:
            variable: experiment_2::ObsValue::${variable}
          y:
            variable: experiment_2::hofx0PassedQc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'red'
          label: 'JEDI h(x) versus obs (passed QC in JEDI)'

  # GSI h(x) vs Observations
  - batch figure:
      variables: *variables
      channels: *channels
    figure:
      layout: [2,1]
      title: 'Observations vs. GSI h(x) | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/correlation_scatter/${variable}${channel}/gsi_hofx0_vs_obs_{{instrument}}_${variable}${channel}.png'
    plots:
      - add_xlabel: 'Observation Value'
        add_ylabel: 'GSI h(x)'
        add_title: '{{experiment_id_1}} (1)'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_1::ObsValue::${variable}
          y:
            variable: experiment_1::GsiHofXBc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'black'
          label: 'GSI h(x) versus obs (all obs)'
        - type: Scatter
          x:
            variable: experiment_1::ObsValue::${variable}
          y:
            variable: experiment_1::GsiHofXBcPassedQc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'red'
          label: 'GSI h(x) versus obs (passed QC in JEDI)'

      - add_xlabel: 'Observation Value'
        add_ylabel: 'GSI h(x)'
        add_title: '{{experiment_id_2}} (2)'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_2::ObsValue::${variable}
          y:
            variable: experiment_2::GsiHofXBc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'black'
          label: 'GSI h(x) versus obs (all obs)'
        - type: Scatter
          x:
            variable: experiment_2::ObsValue::${variable}
          y:
            variable: experiment_2::GsiHofXBcPassedQc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'red'
          label: 'GSI h(x) versus obs (passed QC in JEDI)'

  # JEDI h(x) vs GSI h(x)
  - batch figure:
      variables: *variables
      channels: *channels
    figure:
      layout: [2,1]
      title: 'JEDI h(x) vs. GSI h(x) | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/correlation_scatter/${variable}${channel}/gsi_hofx_vs_jedi0_hofx_{{instrument}}_${variable}${channel}.png'
    plots:
      - add_xlabel: 'GSI h(x)'
        add_ylabel: 'JEDI h(x)'
        add_title: '{{experiment_id_1}} (1)'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_1::GsiHofXBc::${variable}
          y:
            variable: experiment_1::hofx0::${variable}
          channel: ${channel}
          markersize: 5
          color: 'black'
          label: 'JEDI h(x) versus GSI h(x)'
        - type: Scatter
          x:
            variable: experiment_1::GsiHofXBcPassedQc::${variable}
          y:
            variable: experiment_1::hofx0PassedQc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'red'
          label: 'JEDI h(x) versus GSI h(x) (passed QC in JEDI)'

      - add_xlabel: 'GSI h(x)'
        add_ylabel: 'JEDI h(x)'
        add_title: '{{experiment_id_2}} (2)'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_2::GsiHofXBc::${variable}
          y:
            variable: experiment_2::hofx0::${variable}
          channel: ${channel}
          markersize: 5
          color: 'black'
          label: 'JEDI h(x) versus GSI h(x)'
        - type: Scatter
          x:
            variable: experiment_2::GsiHofXBcPassedQc::${variable}
          y:
            variable: experiment_2::hofx0PassedQc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'red'
          label: 'JEDI h(x) versus GSI h(x) (passed QC in JEDI)'

  # JEDI hofx0 vs GSI hofx0
  - batch figure:
      variables: *variables
      channels: *channels
    figure:
      layout: [2,1]
      title: 'JEDI hofx0 vs. GSI hofx0 | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/correlation_scatter/${variable}${channel}/gsi_hofx0_vs_jedi_hofx0_{{instrument}}_${variable}${channel}.png'
    plots:
      - add_xlabel: 'GSI observation minus h(x)'
        add_ylabel: 'JEDI observation minus h(x)'
        add_title: '{{experiment_id_1}} (1)'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_1::ObsValueMinusGsiHofXBc::${variable}
          y:
            variable: experiment_1::ObsValueMinusHofx0::${variable}
          channel: ${channel}
          markersize: 5
          color: 'black'
          label: 'GSI hofx0 vs JEDI hofx0 (all obs)'
        - type: Scatter
          x:
            variable: experiment_1::ObsValueMinusGsiHofXBcPassedQc::${variable}
          y:
            variable: experiment_1::ObsValueMinushofx0PassedQc::${variable}
          channel: ${channel}
          markersize: 5
          color: 'red'
          label: 'GSI hofx0 vs JEDI hofx0 (passed QC in JEDI)'

      - add_xlabel: 'GSI observation minus h(x)'
        add_ylabel: 'JEDI observation minus h(x)'
        add_title: '{{experiment_id_2}} (2)'
