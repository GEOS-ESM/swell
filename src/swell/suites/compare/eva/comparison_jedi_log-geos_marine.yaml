datasets:

- type: JediLog
  collection_name: jedi_log_test_exp
  jedi_log_to_parse: '{{cycle_dir_exp}}/jedi_{{log_type}}_log.log'
  data_to_parse:
    convergence: true

- type: JediLog
  collection_name: jedi_log_test_ctl
  jedi_log_to_parse: '{{cycle_dir_ctl}}/jedi_{{log_type}}_log.log'
  data_to_parse:
    convergence: true

graphics:

  plotting_backend: Emcpy
  figure_list:

  - figure:
      title: 'Residual Norm and Norm Reduction Plots'
      output name: '{{cycle_dir}}/eva/jedi_log/convergence/residual_norm_reduction.png'
    plots:
      - add_xlabel: 'Total inner iteration number'
        add_ylabel: 'Normalized Value'
        add_legend:
        layers:
        - type: LinePlot
          x:
            variable: jedi_log_test_exp::convergence::total_iteration
          y:
            variable: jedi_log_test_exp::convergence::residual_norm_normalized
          color: 'red'
          label: '{{experiment_tag_exp}} Normalized residual norm'
        - type: LinePlot
          x:
            variable: jedi_log_test_ctl::convergence::total_iteration
          y:
            variable: jedi_log_test_ctl::convergence::residual_norm_normalized
          color: 'blue'
          label: '{{experiment_tag_ctl}} Normalized residual norm'
        - type: LinePlot
          x:
            variable: jedi_log_test_exp::convergence::total_iteration
          y:
            variable: jedi_log_test_exp::convergence::norm_reduction_normalized
          color: 'yellow'
          label: '{{experiment_tag_exp}} Normalized norm reduction'
        - type: LinePlot
          x:
            variable: jedi_log_test_ctl::convergence::total_iteration
          y:
            variable: jedi_log_test_ctl::convergence::norm_reduction_normalized
          color: 'green'
          label: '{{experiment_tag_ctl}} Normalized norm reduction'
