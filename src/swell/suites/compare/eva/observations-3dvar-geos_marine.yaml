datasets:

- name: experiment_1
  type: IodaObsSpace
  filenames:
    - {{obs_path_file_1}}
  groups:
    - name: ObsValue
      variables: &variables {{simulated_variables}}
    - name: hofx0
    - name: hofx1
    - name: ombg
    - name: oman
    - name: MetaData
    - name: EffectiveQC0
    - name: EffectiveQC1

- name: experiment_2
  type: IodaObsSpace
  filenames:
    - {{obs_path_file_2}}
  groups:
    - name: ObsValue
      variables: *variables
    - name: hofx0
    - name: hofx1
    - name: ombg
    - name: oman
    - name: MetaData
    - name: EffectiveQC0
    - name: EffectiveQC1

transforms:

# Generate Increment for JEDI 1
- transform: arithmetic
  new name: experiment_1::increment::${variable}
  equals: experiment_1::ombg::${variable}-experiment_1::oman::${variable}
  for:
    variable: *variables

# Generate Increment for JEDI 2
- transform: arithmetic
  new name: experiment_2::increment::${variable}
  equals: experiment_2::ombg::${variable}-experiment_2::oman::${variable}
  for:
    variable: *variables

# Generate hofx0 that passed QC for JEDI 1
- transform: accept where
  new name: experiment_1::hofx0PassedQc::${variable}
  starting field: experiment_1::hofx0::${variable}
  where:
    - experiment_1::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate hofx0 that passed QC for JEDI 2
- transform: accept where
  new name: experiment_2::hofx0PassedQc::${variable}
  starting field: experiment_2::hofx0::${variable}
  where:
    - experiment_2::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate hofx1 that passed QC for JEDI 1
- transform: accept where
  new name: experiment_1::hofx1PassedQc::${variable}
  starting field: experiment_1::hofx1::${variable}
  where:
    - experiment_1::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate hofx1 that passed QC for JEDI 2
- transform: accept where
  new name: experiment_2::hofx1PassedQc::${variable}
  starting field: experiment_2::hofx1::${variable}
  where:
    - experiment_2::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate ombg that passed QC for JEDI 1
- transform: accept where
  new name: experiment_1::ombgPassedQc::${variable}
  starting field: experiment_1::ombg::${variable}
  where:
    - experiment_1::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate ombg that passed QC for JEDI 2
- transform: accept where
  new name: experiment_2::ombgPassedQc::${variable}
  starting field: experiment_2::ombg::${variable}
  where:
    - experiment_2::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate oman that passed QC for JEDI 1
- transform: accept where
  new name: experiment_1::omanPassedQc::${variable}
  starting field: experiment_1::oman::${variable}
  where:
    - experiment_1::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate oman that passed QC for JEDI 2
- transform: accept where
  new name: experiment_2::omanPassedQc::${variable}
  starting field: experiment_2::oman::${variable}
  where:
    - experiment_2::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate obs that passed QC for JEDI 1
- transform: accept where
  new name: experiment_1::ObsValuePassedQc::${variable}
  starting field: experiment_1::ObsValue::${variable}
  where:
    - experiment_1::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate obs that passed QC for JEDI 2
- transform: accept where
  new name: experiment_2::ObsValuePassedQc::${variable}
  starting field: experiment_2::ObsValue::${variable}
  where:
    - experiment_2::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

graphics:

  plotting_backend: Emcpy
  figure_list:

  # Correlation scatter plots
  # -------------------------

  # JEDI h(x) vs Observations
  - batch figure:
      variables: *variables
    figure:
      layout: [2,1]
      figure size: [20, 10]
      title: 'Observations vs. JEDI h(x) | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/correlation_scatter/${variable}/jedi_hofx_vs_obs_{{instrument}}_${variable}.png'
    plots:
      - add_xlabel: 'Observation Value'
        add_ylabel: 'JEDI h(x)'
        add_title: '{{experiment_id_1}} (1)'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_1::ObsValue::${variable}
          y:
            variable: experiment_1::hofx0PassedQc::${variable}
          markersize: 5
          color: 'black'
          label: 'JEDI h(x)_0 versus obs (passed QC in JEDI)'
        - type: Scatter
          x:
            variable: experiment_1::ObsValue::${variable}
          y:
            variable: experiment_1::hofx1PassedQc::${variable}
          markersize: 5
          color: 'red'
          label: 'JEDI h(x)_1 versus obs (passed QC in JEDI)'

      - add_xlabel: 'Observation Value'
        add_ylabel: 'JEDI h(x)'
        add_title: '{{experiment_id_2}} (2)'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_2::ObsValue::${variable}
          y:
            variable: experiment_2::hofx0PassedQc::${variable}
          markersize: 5
          color: 'black'
          label: 'JEDI h(x)_0 versus obs (passed QC in JEDI)'
        - type: Scatter
          x:
            variable: experiment_2::ObsValue::${variable}
          y:
            variable: experiment_2::hofx1PassedQc::${variable}
          markersize: 5
          color: 'red'
          label: 'JEDI h(x)_1 versus obs (passed QC in JEDI)'

  # Histogram plots
  # ---------------

  # JEDI h(x) vs Observations
  - batch figure:
      variables: *variables
    dynamic options:
      - type: histogram_bins
        data variable: experiment::omanPassedQc::${variable}
        number of bins rule: 'rice'
    figure:
      layout: [2,1]
      figure size: [20, 10]
      title: 'Observations vs. JEDI h(x) | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/histogram/${variable}/ombg_oman_{{instrument}}_${variable}.png'
    plots:
      - add_xlabel: 'Difference'
        add_ylabel: 'Count'
        add_title: '{{experiment_id_1}} (1)'
        set_xlim: [-3, 3]
        add_legend:
          loc: 'upper left'
        statistics:
          fields:
            - field_name: experiment_1::ombgPassedQc::${variable}
              xloc: 0.5
              yloc: -0.10
              kwargs:
                color: 'black'
                fontsize: 8
                fontfamily: monospace
            - field_name: experiment_1::omanPassedQc::${variable}
              xloc: 0.5
              yloc: -0.13
              kwargs:
                color: 'red'
                fontsize: 8
                fontfamily: monospace
          statistics_variables:
          - n
          - min
          - mean
          - max
          - std
        layers:
        - type: Histogram
          data:
            variable: experiment_1::ombgPassedQc::${variable}
          color: 'red'
          label: 'observations minus background '
          bins: ${dynamic_bins}
          alpha: 0.5
          density: true
        - type: Histogram
          data:
            variable: experiment_1::omanPassedQc::${variable}
          color: 'blue'
          label: 'observations minus analysis'
          bins: ${dynamic_bins}
          alpha: 0.5
          density: true

      - add_xlabel: 'Difference'
        add_ylabel: 'Count'
        add_title: '{{experiment_id_2}} (2)'
        set_xlim: [-3, 3]
        add_legend:
          loc: 'upper left'
        statistics:
          fields:
            - field_name: experiment_2::ombgPassedQc::${variable}
              xloc: 0.5
              yloc: -0.10
              kwargs:
                color: 'black'
                fontsize: 8
                fontfamily: monospace
            - field_name: experiment_2::omanPassedQc::${variable}
              xloc: 0.5
              yloc: -0.13
              kwargs:
                color: 'red'
                fontsize: 8
                fontfamily: monospace
          statistics_variables:
          - n
          - min
          - mean
          - max
          - std
        layers:
        - type: Histogram
          data:
            variable: experiment_2::ombgPassedQc::${variable}
          color: 'red'
          label: 'observations minus background '
          bins: ${dynamic_bins}
          alpha: 0.5
          density: true
        - type: Histogram
          data:
            variable: experiment_2::omanPassedQc::${variable}
          color: 'blue'
          label: 'observations minus analysis'
          bins: ${dynamic_bins}
          alpha: 0.5
          density: true

  # Map plots
  # ---------
  # Increment
  - batch figure:
      variables: *variables
    dynamic options:
      - type: vminvmaxcmap
        data variable: experiment_1::ombgPassedQc::${variable}
    figure:
      figure size: [40,10]
      layout: [4,1]
      title: '{{instrument_title}} | Passed QC'
      output name: '{{cycle_dir}}/eva/{{instrument}}/map_plots/${variable}/ombg_oman_{{instrument}}_${variable}.png'
    plots:
      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: ObsValue
        add_grid:
        add_title: '{{experiment_id_1}} (1)'
        layers:
        - type: MapScatter
          longitude:
            variable: experiment_1::MetaData::longitude
          latitude:
            variable: experiment_1::MetaData::latitude
          data:
            variable: experiment_1::ombgPassedQc::${variable}
          markersize: 2
          label: OmAn
          colorbar: true
          cmap: ${dynamic_cmap}
          vmin: ${dynamic_vmin}
          vmax: ${dynamic_vmax}

      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: ObsValue
        add_grid:
        add_title: '{{experiment_id_1}} (1)'
        layers:
        - type: MapScatter
          longitude:
            variable: experiment_1::MetaData::longitude
          latitude:
            variable: experiment_1::MetaData::latitude
          data:
            variable: experiment_1::omanPassedQc::${variable}
          markersize: 2
          label: OmBg
          colorbar: true
          cmap: ${dynamic_cmap}
          vmin: ${dynamic_vmin}
          vmax: ${dynamic_vmax}

      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: ObsValue
        add_grid:
        add_title: '{{experiment_id_2}} (2)'
        layers:
        - type: MapScatter
          longitude:
            variable: experiment_2::MetaData::longitude
          latitude:
            variable: experiment_2::MetaData::latitude
          data:
            variable: experiment_2::ombgPassedQc::${variable}
          markersize: 2
          label: OmAn
          colorbar: true
          cmap: ${dynamic_cmap}
          vmin: ${dynamic_vmin}
          vmax: ${dynamic_vmax}

      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: ObsValue
        add_grid:
        add_title: '{{experiment_id_2}} (2)'
        layers:
        - type: MapScatter
          longitude:
            variable: experiment_2::MetaData::longitude
          latitude:
            variable: experiment_2::MetaData::latitude
          data:
            variable: experiment_2::omanPassedQc::${variable}
          markersize: 2
          label: OmBg
          colorbar: true
          cmap: ${dynamic_cmap}
          vmin: ${dynamic_vmin}
          vmax: ${dynamic_vmax}

  - batch figure:
      variables: *variables
    dynamic options:
      - type: vminvmaxcmap
        data variable: experiment::EffectiveQC1::${variable}
    figure:
      figure size: [40,10]
      layout: [2,1]
      title: '{{instrument_title}} | Passed QC'
      output name: '{{cycle_dir}}/eva/{{instrument}}/map_plots/${variable}/effectiveQC_{{instrument}}_${variable}.png'
    plots:
      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: EffectiveQC1
        add_grid:
        add_title: '{{experiment_id_1}} (1)'
        layers:
        - type: MapScatter
          longitude:
            variable: experiment_1::MetaData::longitude
          latitude:
            variable: experiment_1::MetaData::latitude
          data:
            variable: experiment_1::EffectiveQC1::${variable}
          markersize: 2
          label: OmAn
          colorbar: true
          cmap: ${dynamic_cmap}
          vmin: ${dynamic_vmin}
          vmax: ${dynamic_vmax}

      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: EffectiveQC1
        add_grid:
        add_title: '{{experiment_id_2}} (2)'
        layers:
        - type: MapScatter
          longitude:
            variable: experiment_2::MetaData::longitude
          latitude:
            variable: experiment_2::MetaData::latitude
          data:
            variable: experiment_2::EffectiveQC1::${variable}
          markersize: 2
          label: OmAn
          colorbar: true
          cmap: ${dynamic_cmap}
          vmin: ${dynamic_vmin}
          vmax: ${dynamic_vmax}

  - batch figure:
      variables: *variables
    dynamic options:
      - type: vminvmaxcmap
        data variable: experiment_1::increment::${variable}
    figure:
      figure size: [40,10]
      layout: [2,1]
      title: '{{instrument_title}} | Passed QC'
      output name: '{{cycle_dir}}/eva/{{instrument}}/map_plots/${variable}/increment_{{instrument}}_${variable}.png'
    plots:
      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: Increment (OmBg - OmAn)
        add_grid:
        add_title: '{{experiment_id_1}} (1)'
        layers:
        - type: MapScatter
          longitude:
            variable: experiment_1::MetaData::longitude
          latitude:
            variable: experiment_1::MetaData::latitude
          data:
            variable: experiment_1::increment::${variable}
          markersize: 2
          label: OmAn
          colorbar: true
          cmap: ${dynamic_cmap}
          vmin: ${dynamic_vmin}
          vmax: ${dynamic_vmax}

      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: Increment (OmBg - OmAn)
        add_grid:
        add_title: '{{experiment_id_2}} (2)'
        layers:
        - type: MapScatter
          longitude:
            variable: experiment_2::MetaData::longitude
          latitude:
            variable: experiment_2::MetaData::latitude
          data:
            variable: experiment_2::increment::${variable}
          markersize: 2
          label: OmAn
          colorbar: true
          cmap: ${dynamic_cmap}
          vmin: ${dynamic_vmin}
          vmax: ${dynamic_vmax}