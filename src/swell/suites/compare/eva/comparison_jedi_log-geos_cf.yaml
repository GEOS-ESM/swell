datasets:

- type: JediLog
  collection_name: JediLogTest_exp
  jedi_log_to_parse: '{{cycle_dir_exp}}/jedi_variational_log.log'
  data_to_parse:
    convergence: true

- type: JediLog
  collection_name: JediLogTest_ctl
  jedi_log_to_parse: '{{cycle_dir_ctl}}/jedi_variational_log.log'
  data_to_parse:
    convergence: true

transforms:
- transform: arithmetic
  new name: JediLogTest_exp::convergence::${variable}_log
  equals: log(JediLogTest_exp::convergence::${variable})
  for:
    variable: [residual_norm, norm_reduction]

- transform: arithmetic
  new name: JediLogTest_ctl::convergence::${variable}_log
  equals: log(JediLogTest_ctl::convergence::${variable})
  for:
    variable: [residual_norm, norm_reduction]

graphics:

  plotting_backend: Emcpy
  figure_list:

  - figure:
      layout: [3,1]
      figure size: [12,10]
      title: 'Residual Norm and Norm Reduction Plots'
      output name: '{{cycle_dir}}/eva/jedi_log/convergence/residual_norm_reduction.png'
    plots:
      - add_xlabel: 'Total inner iteration number'
        add_ylabel: 'Residual norm'
        add_legend:
        layers:
        - type: LinePlot
          x:
            variable: JediLogTest_exp::convergence::total_iteration
          y:
            variable: JediLogTest_exp::convergence::residual_norm
          color: 'black'
          label: '{{experiment_tag_exp}} Residual norm'
        - type: LinePlot
          x:
            variable: JediLogTest_ctl::convergence::total_iteration
          y:
            variable: JediLogTest_ctl::convergence::residual_norm
          color: 'red'
          label: '{{experiment_tag_ctl}} Residual norm'

      - add_xlabel: 'Total inner iteration number'
        add_ylabel: 'Log(norm reduction)'
        add_legend: 
        layers:
        - type: LinePlot
          x:
            variable: JediLogTest_exp::convergence::total_iteration
          y:
            variable: JediLogTest_exp::convergence::norm_reduction
          color: 'blue'
          label: '{{experiment_tag_exp}} Norm reduction'

        - type: LinePlot
          x:
            variable: JediLogTest_ctl::convergence::total_iteration
          y:
            variable: JediLogTest_ctl::convergence::norm_reduction
          color: 'green'
          label: '{{experiment_tag_ctl}} Norm reduction'

      - add_xlabel: 'Total inner iteration number'
        add_ylabel: 'Log(reduction)'
        add_legend:
        layers:
        - type: LinePlot
          x:
            variable: JediLogTest_exp::convergence::total_iteration
          y:
            variable: JediLogTest_exp::convergence::residual_norm_log
          color: 'black'
          label: '{{experiment_tag_exp}} Log(residual norm)'
        - type: LinePlot
          x:
            variable: JediLogTest_ctl::convergence::total_iteration
          y:
            variable: JediLogTest_ctl::convergence::residual_norm_log
          color: 'red'
          label: '{{experiment_tag_ctl}} Log(residual norm)'

        - type: LinePlot
          x:
            variable: JediLogTest_exp::convergence::total_iteration
          y:
            variable: JediLogTest_exp::convergence::norm_reduction_log
          color: 'blue'
          label: '{{experiment_tag_exp}} Log norm reduction'
        - type: LinePlot
          x:
            variable: JediLogTest_ctl::convergence::total_iteration
          y:
            variable: JediLogTest_ctl::convergence::norm_reduction_log
          color: 'green'
          label: '{{experiment_tag_ctl}} Log norm reduction'
