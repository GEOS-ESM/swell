datasets:

  - name: experiment_increment_1
    type: SocaRestart
    soca_filenames: {{increment_file_path_1}}
    geometry_file: {{cycle_dir_1}}/INPUT/soca_gridspec.nc

    variables: [Temp, Salt, ave_ssh]
    coordinate variables: [lon, lat]

  - name: experiment_increment_2
    type: SocaRestart
    soca_filenames: {{increment_file_path_2}}
    geometry_file: {{cycle_dir_2}}/INPUT/soca_gridspec.nc

    variables: [Temp, Salt, ave_ssh]
    coordinate variables: [lon, lat]

graphics:

  plotting_backend: Emcpy
  figure_list:

  - batch figure:
      variables: [ave_ssh]
    figure:
      figure size: [60,20]
      layout: [3,1]
      title: 'SOCA Increment'
      output name: '{{cycle_dir}}/eva/increment/map_plots/${variable}/inc_${variable}.png'
    
    # ave_ssh plot 1
    plots:
      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: SSH Increment
        add_grid:
        add_title: '({{experiment_tag_1}}) {{experiment_id_1}}'
        layers:
        - type: MapGridded
          longitude:
            variable: experiment_increment_1::SOCAgrid::lon
          latitude:
            variable: experiment_increment_1::SOCAgrid::lat
          data:
            variable: experiment_increment_1::SOCAVars::ave_ssh
          label: ave_ssh increment
          colorbar: true
          cmap: 'bwr'
          vmin: &vmin_ave_ssh -0.25
          vmax: &vmax_ave_ssh 0.25
      
      # ave_ssh plot 2
      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: SSH Increment
        add_grid:
        add_title: '({{experiment_tag_2}}) {{experiment_id_2}}'
        layers:
        - type: MapGridded
          longitude:
            variable: experiment_increment_2::SOCAgrid::lon
          latitude:
            variable: experiment_increment_2::SOCAgrid::lat
          data:
            variable: experiment_increment_2::SOCAVars::ave_ssh
          label: ave_ssh increment
          colorbar: true
          cmap: 'bwr'
          vmin: *vmin_ave_ssh
          vmax: *vmax_ave_ssh

      # ave_ssh diff plot
      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: SSH Increment Diff
        add_grid:
        add_title: '({{experiment_tag_1}}) - ({{experiment_tag_2}})'
        layers:
        - type: MapGridded
          longitude:
            variable: experiment_increment_1::SOCAgrid::lon
          latitude:
            variable: experiment_increment_1::SOCAgrid::lat
          data:
            variable: experiment_increment_1::SOCAVars::ave_ssh_diff
          label: ave_ssh increment
          colorbar: true
          cmap: 'bwr'
          vmin: &vmin_ave_ssh_diff -0.05
          vmax: &vmax_ave_ssh_diff 0.05

  - batch figure:
      variables: [Temp]
    figure:
      figure size: [60,20]
      layout: [3,1]
      title: 'Soca Increment'
      output name: '{{cycle_dir}}/eva/increment/map_plots/${variable}/inc_${variable}.png'
    plots:
      # Temp plot 1
      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: SST Increment
        add_grid:
        add_title: '({{experiment_tag_1}}) {{experiment_id_1}}'
        layers:
        - type: MapGridded
          longitude:
            variable: experiment_increment_1::SOCAgrid::lon
          latitude:
            variable: experiment_increment_1::SOCAgrid::lat
          data:
            variable: experiment_increment_1::SOCAVars::Temp
            slices: '[0,...]'
          label: SST increment
          colorbar: true
          cmap: 'bwr'
          vmin: &vmin_temp -3
          vmax: &vmax_temp 3

      # Temp plot 2
      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: SST Increment
        add_grid:
        add_title: '({{experiment_tag_2}}) {{experiment_id_2}}'
        layers:
        - type: MapGridded
          longitude:
            variable: experiment_increment_2::SOCAgrid::lon
          latitude:
            variable: experiment_increment_2::SOCAgrid::lat
          data:
            variable: experiment_increment_2::SOCAVars::Temp
            slices: '[0,...]'
          label: SST increment
          colorbar: true
          cmap: 'bwr'
          vmin: *vmin_temp
          vmax: *vmax_temp
      
      # Temp diff plot
      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: SST Increment Diff
        add_grid:
        add_title: '({{experiment_tag_1}}) - ({{experiment_tag_2}})'
        layers:
        - type: MapGridded
          longitude:
            variable: experiment_increment_1::SOCAgrid::lon
          latitude:
            variable: experiment_increment_1::SOCAgrid::lat
          data:
            variable: experiment_increment_1::SOCAVars::Temp_diff
            slices: '[0,...]'
          label: SST increment Diff
          colorbar: true
          cmap: 'bwr'
          vmin: &vmin_temp_diff -0.6
          vmax: &vmax_temp_diff 0.6

  - batch figure:
      variables: [Salt]
    figure:
      figure size: [60,20]
      layout: [3,1]
      title: 'Soca Increment'
      output name: '{{cycle_dir}}/eva/increment/map_plots/${variable}/inc_${variable}.png'
    plots:
      # Salt plot 1
      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: SSS Increment
        add_grid:
        add_title: '({{experiment_tag_1}}) {{experiment_id_1}}'
        layers:
        - type: MapGridded
          longitude:
            variable: experiment_increment_1::SOCAgrid::lon
          latitude:
            variable: experiment_increment_1::SOCAgrid::lat
          data:
            variable: experiment_increment_1::SOCAVars::Salt
            slices: '[0,...]'
          label: SSS increment
          colorbar: true
          cmap: 'bwr'
          vmin: &vmin_salt -1
          vmax: &vmax_salt 1

      # Salt plot 2
      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: SSS Increment
        add_grid:
        add_title: '({{experiment_tag_2}}) {{experiment_id_2}}'
        layers:
        - type: MapGridded
          longitude:
            variable: experiment_increment_2::SOCAgrid::lon
          latitude:
            variable: experiment_increment_2::SOCAgrid::lat
          data:
            variable: experiment_increment_2::SOCAVars::Salt
            slices: '[0,...]'
          label: SSS increment
          colorbar: true
          cmap: 'bwr'
          vmin: *vmin_salt
          vmax: *vmax_salt

      # Salt Diff plot
      - mapping:
          projection: plcarr
          domain: global
        add_map_features: ['coastline']
        add_colorbar:
          label: SSS Increment Diff
        add_grid:
        add_title: '({{experiment_tag_1}}) - ({{experiment_tag_2}})'
        layers:
        - type: MapGridded
          longitude:
            variable: experiment_increment_1::SOCAgrid::lon
          latitude:
            variable: experiment_increment_1::SOCAgrid::lat
          data:
            variable: experiment_increment_1::SOCAVars::Salt_diff
            slices: '[0,...]'
          label: SSS increment Diff
          colorbar: true
          cmap: 'bwr'
          vmin: &vmin_salt_diff -0.2
          vmax: &vmax_salt_diff 0.2

# ssh diff
transforms:
- equals: experiment_increment_1::SOCAVars::ave_ssh-experiment_increment_2::SOCAVars::ave_ssh
  for:
    variable: ave_ssh
  new name: experiment_increment_1::SOCAVars::ave_ssh_diff
  transform: arithmetic

# Temp diff
- equals: experiment_increment_1::SOCAVars::Temp-experiment_increment_2::SOCAVars::Temp
  for:
    variable: Temp
  new name: experiment_increment_1::SOCAVars::Temp_diff
  transform: arithmetic

# Salt diff
- equals: experiment_increment_1::SOCAVars::Salt-experiment_increment_2::SOCAVars::Salt
  for:
    variable: Salt
  new name: experiment_increment_1::SOCAVars::Salt_diff
  transform: arithmetic
