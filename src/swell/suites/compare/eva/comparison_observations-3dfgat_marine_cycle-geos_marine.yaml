datasets:

- name: experiment_exp
  type: IodaObsSpace
  filenames:
    - {{obs_path_file_exp}}
  groups:
    - name: ObsValue
      variables: &variables {{simulated_variables}}
    - name: hofx0
    - name: hofx1
    - name: ombg
    - name: oman
    - name: MetaData
    - name: EffectiveQC0
    - name: EffectiveQC1

- name: experiment_ctl
  type: IodaObsSpace
  filenames:
    - {{obs_path_file_ctl}}
  groups:
    - name: ObsValue
      variables: *variables
    - name: hofx0
    - name: hofx1
    - name: ombg
    - name: oman
    - name: MetaData
    - name: EffectiveQC0
    - name: EffectiveQC1


transforms:

# Generate Increment for JEDI 1
- transform: arithmetic
  new name: experiment_exp::increment::${variable}
  equals: experiment_exp::ombg::${variable}-experiment_exp::oman::${variable}
  for:
    variable: *variables

# Generate Increment for JEDI 2
- transform: arithmetic
  new name: experiment_ctl::increment::${variable}
  equals: experiment_ctl::ombg::${variable}-experiment_ctl::oman::${variable}
  for:
    variable: *variables

# Generate hofx0 that passed QC for JEDI 1
- transform: accept where
  new name: experiment_exp::hofx0PassedQc::${variable}
  starting field: experiment_exp::hofx0::${variable}
  where:
    - experiment_exp::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate hofx0 that passed QC for JEDI 2
- transform: accept where
  new name: experiment_ctl::hofx0PassedQc::${variable}
  starting field: experiment_ctl::hofx0::${variable}
  where:
    - experiment_ctl::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate hofx1 that passed QC for JEDI 1
- transform: accept where
  new name: experiment_exp::hofx1PassedQc::${variable}
  starting field: experiment_exp::hofx1::${variable}
  where:
    - experiment_exp::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate hofx1 that passed QC for JEDI 2
- transform: accept where
  new name: experiment_ctl::hofx1PassedQc::${variable}
  starting field: experiment_ctl::hofx1::${variable}
  where:
    - experiment_ctl::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate ombg that passed QC for JEDI 1
- transform: accept where
  new name: experiment_exp::ombgPassedQc::${variable}
  starting field: experiment_exp::ombg::${variable}
  where:
    - experiment_exp::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate ombg that passed QC for JEDI 2
- transform: accept where
  new name: experiment_ctl::ombgPassedQc::${variable}
  starting field: experiment_ctl::ombg::${variable}
  where:
    - experiment_ctl::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate ombg that passed QC for JEDI diff
- transform: arithmetic
  new name: experiment_ctl::ombgPassedQc::${variable}_diff
  equals: experiment_exp::ombgPassedQc::${variable} - experiment_ctl::ombgPassedQc::${variable}
  for:
    variable: *variables

# Generate oman that passed QC for JEDI 1
- transform: accept where
  new name: experiment_exp::omanPassedQc::${variable}
  starting field: experiment_exp::oman::${variable}
  where:
    - experiment_exp::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate oman that passed QC for JEDI 2
- transform: accept where
  new name: experiment_ctl::omanPassedQc::${variable}
  starting field: experiment_ctl::oman::${variable}
  where:
    - experiment_ctl::EffectiveQC1::${variable} == 0
  for:
    variable: *variables

# Generate oman that passed QC for JEDI diff
- transform: arithmetic
  new name: experiment_ctl::omanPassedQc::${variable}_diff
  equals: experiment_exp::omanPassedQc::${variable} - experiment_ctl::omanPassedQc::${variable}
  for:
    variable: *variables

# Generate passivated ombg that passed QC for JEDI 1
- transform: accept where
  new name: experiment_exp::PassiveombgPassedQc::${variable}
  starting field: experiment_exp::ombg::${variable}
  where:
    - experiment_exp::EffectiveQC1::${variable} == 1
  for:
    variable: *variables

# Generate passivated ombg that passed QC for JEDI 2
- transform: accept where
  new name: experiment_ctl::PassiveombgPassedQc::${variable}
  starting field: experiment_ctl::ombg::${variable}
  where:
    - experiment_ctl::EffectiveQC1::${variable} == 1
  for:
    variable: *variables

# Generate passivated oman that passed QC for JEDI 1
- transform: accept where
  new name: experiment_exp::PassiveomanPassedQc::${variable}
  starting field: experiment_exp::oman::${variable}
  where:
    - experiment_exp::EffectiveQC1::${variable} == 1
  for:
    variable: *variables

# Generate passivated oman that passed QC for JEDI 2
- transform: accept where
  new name: experiment_ctl::PassiveomanPassedQc::${variable}
  starting field: experiment_ctl::oman::${variable}
  where:
    - experiment_ctl::EffectiveQC1::${variable} == 1
  for:
    variable: *variables

# Generate obs that passed QC for JEDI 1
- transform: accept where
  new name: experiment_exp::ObsValuePassedQc::${variable}
  starting field: experiment_exp::ObsValue::${variable}
  where:
    - experiment_exp::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate obs that passed QC for JEDI 2
- transform: accept where
  new name: experiment_ctl::ObsValuePassedQc::${variable}
  starting field: experiment_ctl::ObsValue::${variable}
  where:
    - experiment_ctl::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

graphics:

  plotting_backend: Emcpy
  figure_list:

  # Correlation scatter plots
  # -------------------------

  # JEDI h(x) vs Observations
  - batch figure:
      variables: *variables
    figure:
      layout: [3,1]
      figure size: [10, 30]
      title: 'Observations vs. JEDI h(x) | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/correlation_scatter/${variable}/jedi_hofx_vs_obs_{{instrument}}_${variable}.png'
    plots:
      - add_xlabel: 'Observation Value'
        add_ylabel: 'JEDI h(x)'
        add_title: '({{experiment_tag_exp}}) {{experiment_id_exp}}'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_exp::ObsValue::${variable}
          y:
            variable: experiment_exp::hofx0PassedQc::${variable}
          markersize: 5
          color: 'black'
          label: 'JEDI h(x) versus obs (all obs)'
        - type: Scatter
          x:
            variable: experiment_exp::ObsValue::${variable}
          y:
            variable: experiment_exp::hofx1::${variable}
          markersize: 5
          color: 'red'
          label: 'JEDI h(x) versus obs (passed QC in JEDI)'

      - add_xlabel: 'Observation Value'
        add_ylabel: 'JEDI h(x)'
        add_grid:
        add_title: '({{experiment_tag_ctl}}) {{experiment_id_ctl}}'
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_ctl::ObsValue::${variable}
          y:
            variable: experiment_ctl::hofx0PassedQc::${variable}
          markersize: 5
          color: 'green'
          label: 'JEDI h(x) versus obs (all obs)'
        - type: Scatter
          x:
            variable: experiment_ctl::ObsValue::${variable}
          y:
            variable: experiment_ctl::hofx1::${variable}
          markersize: 5
          color: 'blue'
          label: 'JEDI h(x) versus obs (passed QC in JEDI)'

      - add_xlabel: 'Observation Value'
        add_ylabel: 'JEDI h(x)'
        add_grid:
        add_title: 'Combined'
        add_legend:
          loc: 'upper left'
        layers:
        - type: Scatter
          x:
            variable: experiment_exp::ObsValue::${variable}
          y:
            variable: experiment_exp::hofx0PassedQc::${variable}
          markersize: 2
          color: 'black'
          label: 'JEDI h(x) versus obs (all obs) 1'

        - type: Scatter
          x:
            variable: experiment_exp::ObsValue::${variable}
          y:
            variable: experiment_exp::hofx1::${variable}
          markersize: 2
          color: 'red'
          label: 'JEDI h(x) versus obs (passed QC in JEDI) 1'

        - type: Scatter
          x:
            variable: experiment_ctl::ObsValue::${variable}
          y:
            variable: experiment_ctl::hofx0PassedQc::${variable}
          markersize: 2
          color: 'green'
          label: 'JEDI h(x) versus obs (all obs) 2'
        - type: Scatter
          x:
            variable: experiment_ctl::ObsValue::${variable}
          y:
            variable: experiment_ctl::hofx1::${variable}
          markersize: 2
          color: 'blue'
          label: 'JEDI h(x) versus obs (passed QC in JEDI) 2'

  # Histogram plots
  # ---------------

  # JEDI h(x) vs Observations
  - batch figure:
      variables: *variables
    dynamic options:
      - type: histogram_bins
        data variable: experiment_exp::omanPassedQc::${variable}
        number of bins rule: 'rice'
    figure:
      layout: [2,1]
      title: 'Observations vs. JEDI h(x) | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/histogram/${variable}/ombg_oman_{{instrument}}_${variable}.png'
    plots:
      - add_xlabel: 'Difference'
        add_ylabel: 'Count'
        add_title: '({{experiment_tag_exp}}) {{experiment_id_exp}}'
        set_xlim: [-3, 3]
        add_legend:
          loc: 'upper left'
        statistics:
          fields:
            - field_name: experiment_exp::omanPassedQc::${variable}
              xloc: 0.5
              yloc: -0.10
              kwargs:
                color: 'blue'
                fontsize: 8
                fontfamily: monospace
            - field_name: experiment_exp::ombgPassedQc::${variable}
              xloc: 0.5
              yloc: -0.13
              kwargs:
                color: 'red'
                fontsize: 8
                fontfamily: monospace
          statistics_variables:
          - n
          - min
          - mean
          - max
          - std

        layers:
        - type: Histogram
          data:
            variable: experiment_exp::ombgPassedQc::${variable}
          color: 'red'
          label: 'observations minus background '
          bins: ${dynamic_bins}
          alpha: 0.5
          density: true
        - type: Histogram
