          y:
            variable: experiment_time_series::ombgPassedQcshallow::${variable}_mean
          markersize: 5
          color: 'black'
          label: 'Global mean ombg (0-300m)'
          # label: 'Mean Observation - Background 0-300m (ombg)'

        - type: LinePlot
          x:
