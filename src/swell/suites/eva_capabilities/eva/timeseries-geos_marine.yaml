datasets:

- name: experiment
  type: IodaObsSpace
  filenames: {{obs_filenames}}
  groups:
    - name: ObsValue
      variables: &variables {{simulated_variables}}
    # - name: hofx0
    # - name: hofx1
    - name: ombg
    # - name: oman
    # - name: MetaData
    # - name: EffectiveQC0
    # - name: EffectiveQC1

time_series:

  - begin_date: '{{start_cycle_point}}'
    final_date: '{{final_cycle_point}}'
    interval: '{{ window_length }}'

    collection: experiment
    variables:
      - ombg::absoluteDynamicTopography
      # - ObsValue::seaSurfaceTemperature
      # - ombg::${variable}
    aggregation_methods:
      - mean
    dimension:  Location

graphics:

  plotting_backend: Emcpy
  figure_list:

  - batch figure:
      variables: *variables
    figure:
      layout: [1,1]
      title: 'Mean OmB | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/${variable}/jedi_timeseries_mean_ombg_{{instrument}}_${variable}.png'
    plots:
      - add_xlabel: 'Datetime'
        add_ylabel: 'Mean OmB'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: LinePlot
          x:
            variable: experiment_time_series::MetaData::Dates
          y:
            variable: experiment_time_series::ombg::${variable}_mean
          markersize: 5
          color: 'black'
          label: 'Observation minus bkground h(x)'
