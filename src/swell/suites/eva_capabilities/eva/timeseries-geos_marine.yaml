datasets:

- name: experiment
  type: IodaObsSpace
  filenames: {{obs_filenames}}
  groups:
    - name: ObsValue
      variables: &variables {{simulated_variables}}
    - name: ombg
    - name: oman
    - name: EffectiveQC0
    - name: EffectiveQC1
    - name: MetaData

transforms:

# Generate ombg that passed QC for JEDI
- transform: accept where
  new name: experiment::ombgPassedQc::${variable}
  starting field: experiment::ombg::${variable}
  where:
    - experiment::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate oman that passed QC for JEDI
- transform: accept where
  new name: experiment::omanPassedQc::${variable}
  starting field: experiment::oman::${variable}
  where:
    - experiment::EffectiveQC0::${variable} == 0
  for:
    variable: *variables

# Generate oman that passed QC for JEDI for depth less than 300m
- transform: accept where
  new name: experiment::omanPassedQcshallownorth::${variable}
  starting field: experiment::oman::${variable}
  where:
    - experiment::EffectiveQC0::${variable} == 0
    - experiment::MetaData::depth < 300
    - experiment::MetaData::latitude > 0
    - experiment::MetaData::latitude < 60
  for:
    variable: *variables

# Generate oman that passed QC for JEDI for depth less than 300m
- transform: accept where
  new name: experiment::omanPassedQcshallowsouth::${variable}
  starting field: experiment::oman::${variable}
  where:
    - experiment::EffectiveQC0::${variable} == 0
    - experiment::MetaData::depth < 300
    - experiment::MetaData::latitude < 0
    - experiment::MetaData::latitude > -60
  for:
    variable: *variables

# Generate oman that passed QC for JEDI for depth less than 300m
- transform: accept where
  new name: experiment::omanPassedQcshallow::${variable}
  starting field: experiment::oman::${variable}
  where:
    - experiment::EffectiveQC0::${variable} == 0
    - experiment::MetaData::depth < 300
  for:
    variable: *variables

# Generate ombg that passed QC for JEDI for depth less than 300m
- transform: accept where
  new name: experiment::ombgPassedQcshallow::${variable}
  starting field: experiment::ombg::${variable}
  where:
    - experiment::EffectiveQC0::${variable} == 0
    - experiment::MetaData::depth < 300
  for:
    variable: *variables

# Generate ombg that passed QC for JEDI for depth less than 300m
- transform: accept where
  new name: experiment::ombgPassedQcshallownorth::${variable}
  starting field: experiment::ombg::${variable}
  where:
    - experiment::EffectiveQC0::${variable} == 0
    - experiment::MetaData::depth < 300
    - experiment::MetaData::latitude > 0
    - experiment::MetaData::latitude < 60
  for:
    variable: *variables

# Generate ombg that passed QC for JEDI for depth less than 300m
- transform: accept where
  new name: experiment::ombgPassedQcshallowsouth::${variable}
  starting field: experiment::ombg::${variable}
  where:
    - experiment::EffectiveQC0::${variable} == 0
    - experiment::MetaData::depth < 300
    - experiment::MetaData::latitude < 0
    - experiment::MetaData::latitude > -60
  for:
    variable: *variables


time_series:

  - begin_date: '{{start_cycle_point}}'
    final_date: '{{final_cycle_point}}'
    interval: '{{ window_length }}'

    collection: experiment
    groups:
      - omanPassedQc
      - omanPassedQcshallow
      - omanPassedQcshallownorth
      - omanPassedQcshallowsouth
      - ombgPassedQc
      - ombgPassedQcshallow
      - ombgPassedQcshallownorth
      - ombgPassedQcshallowsouth
    variables: *variables
    aggregation_methods:
      - mean
      # - count
      - std
    dimension:  Location

graphics:

  plotting_backend: Emcpy
  figure_list:

  - batch figure:
      variables: *variables
    figure:
      layout: [1,1]
      title: 'Mean OmB | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/${variable}/jedi_timeseries_mean_ombg_{{instrument}}_${variable}.png'
    plots:
      - add_xlabel: 'Datetime'
        add_ylabel: 'Mean'
        add_grid:
        add_legend:
          loc: 'upper left'
        layers:
        - type: LinePlot
          x:
            variable: experiment_time_series::MetaData::Dates
          y:
            variable: experiment_time_series::ombgPassedQc::${variable}_mean
          markersize: 5
          color: 'black'
          label: 'Mean Observation - Background (ombg)'

        - type: LinePlot
          x:
            variable: experiment_time_series::MetaData::Dates
          y:
            variable: experiment_time_series::omanPassedQc::${variable}_mean
          markersize: 5
          color: 'red'
          label: 'Mean Observation - Analysis h(x) (oman)'

  - batch figure:
      variables: *variables
    figure:
      layout: [1,1]
      title: 'Mean OmB | {{instrument_title}} | ${variable_title}'
      output name: '{{cycle_dir}}/eva/{{instrument}}/${variable}/jedi_timeseries_mean_ombg_{{instrument}}_${variable}_300glb.png'
    plots:
      - add_xlabel: 'Datetime'
        add_ylabel: 'Mean'
        add_grid:
        set_ylim: [-0.4, 0.4]
        add_legend:
          loc: 'upper left'
        layers:
        - type: LinePlot
          x:
