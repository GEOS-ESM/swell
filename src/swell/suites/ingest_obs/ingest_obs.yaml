# Suite and Platform
suite_to_run: ingest_obs
platform: nccs_discover_sles15

# Timing (single cycle for testing)
start_cycle_point: "2023-10-09T15:00:00Z"
final_cycle_point: "2023-10-09T15:00:00Z"
runahead_limit: P1

# Model Components (dynamically generates tasks in flow.cylc)
model_components:
  - geos_marine  # Added marine model
  # - geos_atmosphere


# R2D2 Configuration
r2d2_local_path: /discover/nobackup/projects/gmao/swell/r2d2-local

# Dry-run mode (set to false to actually ingest files)
dry_run: true  # Set to false to actually ingest to R2D2 

# ============================================================================
# Model-Specific Configuration
# ============================================================================
models:

  # Marine (SOCA) model
  # ==========================
  geos_marine:
    cycle_times:
      - T00
      - T06
      - T12
      - T18
    
    window_length: PT6H
    window_offset: PT3H
    
    ingest_items:
      - item_type: observation
        source_directory: /discover/nobackup/projects/gmao/soca/obs/ioda/ocean
        provider: soca  # Triggers automatic pattern: ioda-obs-YYYYMMDDHH-obsname.nc
        
        # OPTIONAL: Can also use explicit filename_pattern for custom file naming
        # filename_pattern: "{obs_name}/%Y/%m/%d/ioda-obs-%Y%m%d%H-{obs_name}.nc"
        
        create_empty_if_missing: false
        observation_types:
          - name: adt_cryosat2n
          - name: adt_jason3
          - name: insitu_profile_argo

