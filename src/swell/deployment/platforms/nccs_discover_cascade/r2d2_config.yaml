databases:
  ${USER}:
    class: LocalDB
    root: {{r2d2_local_path}}
    cache_fetch: false

# v3 API configuration (for centralized nccs-gmao data)
data_hub: nccs-gmao
data_store: r2d2-experiments-nccs-gmao
compute_host: discover-gmao-intel

# Fetch order: try local first, then API
fetch_order:
  - ${USER}

# Cache settings
cache_name: ${USER}
cache_fetch: false
