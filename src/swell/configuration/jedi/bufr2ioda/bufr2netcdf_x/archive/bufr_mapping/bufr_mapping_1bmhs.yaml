bufr:
  variables:
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"
    latitude:
      query: "*/CLAT"
    longitude:
      query: "*/CLON"
    brightnessTemp:
      query: "*/BRITCSTC/TMBR"
      
  splits:
    satId:
      category:
        variable: satelliteIdentifier
        map:
          _3: metop-b
          _4: metop-a
          _5: metop-c
          _209: noaa-18
          _223: noaa-19

encoder:
  dimensions:
    - name: Channel
      paths:
        - "*/BRITCSTC"

  variables:
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "dateTime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degrees_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degrees_east"
      range: [-180, 180]

    - name: "ObsValue/brightnessTemperature"
      coordinates: "longitude latitude Channel"
      source: variables/brightnessTemp
      longName: "Brightness Temperature"
      units: "K"

