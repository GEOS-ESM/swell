bufr:
  variables:
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"
    latitude:
      query: "*/CLAT"
    longitude:
      query: "*/CLON"
    brightnessTemp:
      query: "*/BRITCSTC/TMBR"

encoder:

  dimensions:
    - name: Channel
      source: variables/sensorChannelNumber
      path: "*/IASICHN"

    - name: Cluster 
      path: "*/IASIL1CS"

    - name: Band 
      path: "*/IASIL1CB"

  variables:
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "dateTime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degrees_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degrees_east"
      range: [-180, 180]

#     The unit from BUFR is W m-2 sr-1 m -- this is radiance per wavenumber
#   - name: "ObsValue/spectralRadiance"
    - name: "ObsValue/radiance"
      source: variables/spectralRadiance
      longName: "IASI Spectral Radiance"
      units: "W m-2 sr-1"

