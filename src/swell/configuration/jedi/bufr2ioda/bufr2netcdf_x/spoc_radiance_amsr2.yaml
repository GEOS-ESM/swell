bufr:
  subsets:
    - NC021248

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    satelliteId:
      query: '*/SAID'

    sensorId:
      query: "*/SIID"      

    solarAzimuth:
      query: "*/SOLAZI"

    solarElevation:
      query: "*/SOEL"

    incidenceAngle:
      query: "*/IANG"

    azimuthAngle:
      query: "*/AANG"

    brightnessTemperature:
      query: '*/AMSR2CHN/TMBR'

    fieldOfViewNumber:
      query: '*/FOVN'

encoder:
  backend: netcdf

  dimensions:
  - name: Channel
    path: '*/AMSR2CHN'

  globals:
  - name: platformCommonName
    type: string
    value: AMSR2

  - name: platformLongDescription
    type: string
    value: Advanced Microwave Scanning Radiometer 2

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]
      
    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"
      range: [ -180, 180 ]

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteId
      longName: "Satellite Identifier"

    - name: "MetaData/instrumentIdentifier"
      source: variables/sensorId
      longName: "Satellite Instrument Identifier"

    - name: "MetaData/solarAzimuth"
      source: variables/solarAzimuth
      longName: "Solar Azimuth"
      units: "degree"
      range: [ 0, 360 ]

    - name: "MetaData/solarElevation"
      source: variables/solarElevation
      longName: "SOLAR ELEVATION"

    - name: "MetaData/sensorZenithAngle"
      longName: "INCIDENCE ANGLE"
      source: variables/incidenceAngle
      units: "degree"

    - name: "MetaData/azimuthAngle"
      longName: "Azimuth Angle"
      source: variables/azimuthAngle
      units: "degree"
      range: [ 0, 360 ]

    - name: "MetaData/fieldOfViewNumber"
      source: variables/fieldOfViewNumber
      longName: "Field of View Number"

#variables      
    - name: "ObsValue/brightnessTemperature"
      longName: "Brightness Temperature"
      chunks: [1000, 15]
      compressionLevel: 4
      coordinates: longitude latitude Channel
      range: [100, 500]
      source: variables/brightnessTemperature
      units: K
