bufr:
  subsets:
    - NC021042

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    dataReceiptTime:
      datetime:
        year: "*/RCYR"
        month: "*/RCMO"
        day: "*/RCDY"
        hour: "*/RCHR"
        minute: "*/RCMI"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    satelliteId:
      query: "*/SAID"

    satelliteZenithAngle:
      query: "*/SAZA"

    solarZenithAngle:
      query: "*/SOZA"

    landOrSeaQualifier:
      query: "*/LSQL"

    geopotentialHeight:
      query: "*/HITE"

    sensorCentralFrequency:
      query: "*/RPSEQ10{4-11}/SCCF"

    sensorBandWidth:
      query: "*/RPSEQ10{4-11}/SCBW"

    satelliteInstrumentData:
      query: "*/SIDP"

    channelSequenceNumber:
      query: "*/SEQNUM"

    dataProviderOrigin:
      query: "*/GCLONG"

    meteorologicalFeature:
      query: "*/RPSEQ10{4-11}/METFET"

    # ObsValue   
    cloudAmount:
      query: "*/CLDMNT"

    cloudFree:
      query: "*/NCLDMNT"

    brightnessTemperature:
      query: "*/RPSEQ10{4-11}/TMBRST"

    clearSkyStandardDeviation:
      query: "*/RPSEQ10{4-11}/SDTB"

    percentConfidence: 
      query: "*/RPSEQ10{4-11}/PCCF"

    verticalSignificance: 
      query: "[*/VSAT, */RPSEQ10{4-11}/VSAT]"

  splits:
    satId:
      category:
        variable: satelliteId
        map:
          _55: m8
          _56: m9
          _57: m10
          _70: m11

encoder:
  dimensions:
    - name: Channel
      path: "*/RPSEQ10{4-11}"

  globals:
    - name: "platformCommonName"
      type: string
      value: "METEOSAT"

    - name: "platformLongDescription"
      type: string
      value: "Geostationary Satellite Operated by EUMETSAT in the Meteosat Second Generation (MSG) Series"

    - name: "sensor"
      type: string
      value: "Spinning Enhanced Visible Infra-Red Imager"

    - name: "providerFullName"
      type: string
      value: "European Organisation for the Exploitation of Meteorological Satellites (EUMETSAT)"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Center for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Dump containing NC021042 SEVIRI ALL SKY RADIANCES (ASR)"

    - name: "processingLevel"
      type: string
      value: "Level-2"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:

    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/dataReceiptTime"
      source: variables/dataReceiptTime
      longName: "Observation Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degrees_north"
      range: [ -90, 90 ]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degrees_east"
      range: [ -180, 180 ]

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteId
      longName: "Satellite Identifier"

    - name: "MetaData/satelliteZenithAngle"
      source: variables/satelliteZenithAngle
      longName: "Satellite Zenith Angle"
      units: "degree"
      range: [ 0, 90 ]

    - name: "MetaData/solarZenithAngle"
      source: variables/solarZenithAngle
      longName: "Solar Zenith Angle"
      units: "degree"
      range: [0, 180]

    - name: "MetaData/landOrSeaQualifier"
      source: variables/landOrSeaQualifier
      longName: "Land/Sea Qualifier"

    - name: "MetaData/geopotentialHeight"
      source: variables/geopotentialHeight
      longName: "Geopotential Height"
      units: "m"

    - name: "MetaData/sensorCentralFrequency"
      source: variables/sensorCentralFrequency
      longName: "Satellite Channel Center Frequency"
      units: "Hz"

    - name: "MetaData/sensorBandWidth"
      source: variables/sensorBandWidth
      longName: "Satellite Channel Bandwidth"
      units: "Hz"

    - name: "MetaData/satelliteInstrumentData"
      source: variables/satelliteInstrumentData
      longName: "Satellite Instrument Data Used In Processing"

    - name: "MetaData/channelSequenceNumber"
      source: variables/channelSequenceNumber
      longName: "Channel Sequence Number"

    - name: "MetaData/dataProviderOrigin"
      source: variables/dataProviderOrigin
      longName: "Data Provider Origin"

    - name: "MetaData/meteorologicalFeature"
      source: variables/meteorologicalFeature
      longName: "Meteorological Feature"

    # ObsValue  
    - name: "ObsValue/cloudAmount"
      source: variables/cloudAmount
      longName: "Cloud Amount in Segment"
      units: "1"

    - name: "ObsValue/cloudFree"
      source: variables/cloudFree
      longName: "Segment Amount Cloud Free"
      units: "1"

    - name: "ObsValue/brightnessTemperature"
      source: variables/brightnessTemperature
      longName: "Brightness Temperature"
      units: "K"

    - name: "ObsValue/clearSkyStandardDeviation"
      source: variables/clearSkyStandardDeviation
      longName: "Brightness Temperature Standard Deviation"
      units: "K"

    - name: "ObsValue/percentConfidence"
      source: variables/percentConfidence
      longName: "Percent Confidence"
      units: "1"

    - name: "ObsValue/verticalSignificance"
      source: variables/verticalSignificance
      longName: "Vertical Significance (Satellite Observations)"
      units: "1"    
