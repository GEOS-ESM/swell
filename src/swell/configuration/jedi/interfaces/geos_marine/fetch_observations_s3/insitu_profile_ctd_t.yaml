# WOD CTD temperature profiles from the public NOAA reanalysis bucket (NNJA).
#
# Temperature and salinity are published as separate IODA v3 files; this fetches the
# temperature file. Salinity has its own registry file (insitu_profile_ctd_s.yaml).
#
# Only 2023 is uploaded so far; earlier years are being backfilled from 1988.

s3_bucket: noaa-reanalyses-pds

s3_key_template: observations/reanalysis/insitu/wod/ctd/YYYY/MM/iodav3/wod_ctd_t.YYYYMMDD.THHz_iodav3.nc

# These files sit on the 6-hourly synoptic grid, not Swell's default T03/T09/T15/T21.
obs_timesteps: ['T00', 'T06', 'T12', 'T18']
obs_window_length: PT6H
