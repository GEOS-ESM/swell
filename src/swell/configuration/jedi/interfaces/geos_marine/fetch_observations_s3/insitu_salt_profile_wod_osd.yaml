# WOD OSD (Ocean Station Data) salinity profiles from the public NOAA reanalysis bucket (NNJA).
#
# Temperature and salinity are published as separate IODA v3 files; this fetches the
# salinity file. Temperature has its own registry file (insitu_temp_profile_wod_osd.yaml).

s3_bucket: noaa-reanalyses-pds

s3_key_template: observations/reanalysis/insitu/wod/osd/YYYY/MM/iodav3/wod_osd_s.YYYYMMDD.THHz_iodav3.nc

# These files sit on the 6-hourly synoptic grid, not Swell's default T03/T09/T15/T21.
obs_timesteps: ['T00', 'T06', 'T12', 'T18']
obs_window_length: PT6H
