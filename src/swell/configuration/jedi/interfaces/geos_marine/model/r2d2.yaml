fetch:
  fc:
    - file_type: MOM.res
      filename: '{{cycle_dir}}/MOM6.res.{{local_background_time}}.nc'
    {% if 'cice6' in marine_models %}
    - file_type: cice.res
      filename: '{{cycle_dir}}/cice.res.{{local_background_time}}.nc'
    {% endif %}
store:
  an:
    - file_type: ocn.incr
      filename: '{{cycle_dir}}/ocn.{{experiment_id}}.incr.{{analysis_time_iso}}.nc'
    {% if 'cice6' in marine_models %}
    - file_type: ice.incr
      filename: '{{cycle_dir}}/ice.{{experiment_id}}.incr.{{analysis_time_iso}}.nc'
    {% endif %}
  fc:
    - file_type: MOM.res
      filename: '{{cycle_dir}}/MOM6.res.{{local_background_time}}.nc'
    {% if 'cice6' in marine_models %}
    - file_type: cice.res
      filename: '{{cycle_dir}}/cice.res.{{local_background_time}}.nc'
    {% endif %}

