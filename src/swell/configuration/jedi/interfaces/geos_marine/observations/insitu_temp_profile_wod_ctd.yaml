obs space:
  name: insitu_temp_profile_wod_ctd
  obsdatain:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/insitu_temp_profile_wod_ctd.{{window_begin}}.nc4'
  obsdataout:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/{{experiment_id}}.insitu_temp_profile_wod_ctd.{{window_begin}}.nc4'
  simulated variables: [waterTemperature]
obs operator:
  name: InsituTemperature
obs error:
  covariance model: diagonal
obs filters:
- filter: Domain Check
  where:
  - variable: {name: GeoVaLs/sea_area_fraction}
    minvalue: 0.9
- filter: Background Check
  threshold: 3.0
- filter: Domain Check
  where:
  - variable: {name: GeoVaLs/sea_surface_temperature}
    minvalue: 2.0
- filter: Domain Check
  where:
  - variable: {name: GeoVaLs/distance_from_coast}
    minvalue: 100e3
