obs space:
  name: insitu_salt_profile_wod_ctd
  obsdatain:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/insitu_salt_profile_wod_ctd.{{window_begin}}.nc4'
  obsdataout:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/{{experiment_id}}.insitu_salt_profile_wod_ctd.{{window_begin}}.nc4'
  simulated variables: [salinity]
obs operator:
  name: VertInterp
  # note: alias file is needed for now because of a conflict with "waterTemperature".
  # The built-in alias maps to "ocean_temperature", but soca uses "sea_water_temperature"
  observation alias file: '{{experiment_root}}/{{experiment_id}}/configuration/jedi/interfaces/{{model_component}}/observations/obsop_name_map.yaml'
  vertical coordinate: sea_water_depth
  observation vertical coordinate: depth
  interpolation method: linear
obs error:
  covariance model: diagonal
obs filters:
- filter: Domain Check
  where:
  - variable: {name: GeoVaLs/sea_area_fraction}
    minvalue: 0.9
- filter: Domain Check
  where:
  - variable: {name: ObsError/salinity}
    minvalue: 0.0001
- filter: Bounds Check
  where:
  - variable: {name: ObsValue/salinity}
    minvalue: 1.0
    maxvalue: 40.0
- filter: Background Check
  threshold: 3.0
- filter: Domain Check
  where:
  - variable: {name: GeoVaLs/sea_surface_temperature}
    minvalue: 2.0
- filter: Domain Check
  where:
  - variable: {name: GeoVaLs/distance_from_coast}
    minvalue: 100e3
