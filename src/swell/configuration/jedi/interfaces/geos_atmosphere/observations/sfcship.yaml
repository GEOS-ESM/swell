obs space:
  name: Surface Marine Stations
  obsdatain:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/sfcship.{{window_begin}}.nc4'
      missing file action: warn
  obsdataout:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/{{experiment_id}}.sfcship.{{window_begin}}.nc4'
  io pool:
    max pool size: 6
#  simulated variables: [windEastward, windNorthward, virtualTemperature, airTemperature,
#                        specificHumidity, stationPressure]
  simulated variables: [stationPressure]
  
obs operator:
  name: Identity
  observation alias file: '{{experiment_root}}/{{experiment_id}}/configuration/jedi/interfaces/{{model_component}}/observations/obsop_name_map.yaml'
obs error:
  covariance model: diagonal
