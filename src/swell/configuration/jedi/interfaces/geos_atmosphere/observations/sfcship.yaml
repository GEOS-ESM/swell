obs space:
  name: Surface Marine Stations
  obsdatain:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/sfcship.{{window_begin}}.nc4'
      missing file action: warn
  obsdataout:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/{{experiment_id}}.sfcship.{{window_begin}}.nc4'
  io pool:
    max pool size: 6
  simulated variables: [stationPressure]

obs operator:
  name: Composite
  components:

   # Surface pressure is handled using the correction scheme
   - name: SfcCorrected
     variables:
     - name: stationPressure
     correction scheme to use: GSL
     geovar_geomz: geopotential_height
     geovar_sfc_geomz: height_above_mean_sea_level_at_surface
     station_altitude: height

linear obs operator:
  name: Composite
  components:

   # Specific humidity and station pressure is using the lowest model level (identity)
   - name: Identity
     variables:
     - name: stationPressure

obs error:
  covariance model: diagonal
