# assign TempObsErrorData/airTemperature  <--- ObsErrorData before changing its Min and Max
- filter: Variable Assignment
  assignments:
  - name: TempObsErrorData/airTemperature
    type: float
    function:
      name: ObsFunction/Arithmetic
      options:
        variables:
        - name: ObsErrorData/airTemperature
  defer to post: true

# set ObsErrorData 1.3 K if it < 1.3 K
- filter: Perform Action
  filter variables:
  - name: airTemperature
  action:
    name: assign error
    error parameter: 1.3
  where:
  - variable:
      name: TempObsErrorData/airTemperature
    maxvalue: 1.3
  - variable:
      name: TempObsErrorData/airTemperature
    value: is_valid
  defer to post: true

# set ObsErrorData 5.6 K if it > 5.6 K.
- filter: Perform Action
  filter variables:
  - name: airTemperature
  action:
    name: assign error
    error parameter: 5.6
  where:
  - variable:
      name: TempObsErrorData/airTemperature
    minvalue: 5.6
  - variable:
      name: TempObsErrorData/airTemperature
    value: is_valid
  defer to post: true

# Screen data by PreUseFlag. PreUseFlag is assigned in reading programs in GSI.
- filter: Perform Action
  filter variables:
  - name: airTemperature
  where:
  - variable: PreUseFlag/airTemperature
    # PreUseFlag should =< ijter ( # of outloop(0,1,2) + 1) in GSI
    minvalue: 1
  action:
    name: reject

# Background  check
# ratio threshold 7.0
- filter: Background Check
# test_hofx: HofXBc
  filter variables:
  - name: airTemperature
  threshold: 7.0
  action:
    name: reject
  where:
  - variable: PreQC/airTemperature
    is_not_in: [3]
  defer to post: true

# ratio threshold * 0.7 if PreQC=3
- filter: Background Check
# test_hofx: HofXBc
  filter variables:
  - name: airTemperature
  threshold: 4.9
  action:
    name: reject
  where:
  - variable: PreQC/airTemperature
    is_in: [3]
  defer to post: true

# Re-assign error ObsErrorData/airTemperature <--- TempObsErrorData/airTemperature
- filter: Perform Action
  filter variables:
  - name: airTemperature
  action:
    name: assign error
    error function: TempObsErrorData/airTemperature
  where:
  - variable:
      name: TempObsErrorData/airTemperature
    value: is_valid
  defer to post: true

## Duplicate factor
- filter: Perform Action
  filter variables:
  - name: airTemperature
  action:
    name: inflate error
    inflation variable:
      name: ObsFunction/ObsErrorFactorDuplicateCheck
      options:
        use_air_pressure: true
        variable: airTemperature
  defer to post: true

