obs space:
  name: Aircraft Temperature
  obsdatain:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/aircraft_temperature.{{window_begin}}.nc4'
    obsgrouping:
      group variables: ["stationIdentification", "releaseTime"]
      sort variable: "pressure"
      sort order: "descending"
  obsdataout:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/{{experiment_id}}.aircraft_temperature.{{window_begin}}.nc4'
  simulated variables: [airTemperature]

obs bias:
  input file: '{{cycle_dir}}/aircraft_temperature.{{background_time}}.acftbias'
  output file: '{{cycle_dir}}/aircraft_temperature.{{window_begin}}.acftbias'
  bc by record: true
  variational bc:
    predictors:
    - name: constant
    - name: obsMetadataPredictor
      variable: instantaneousAltitudeRate
    - name: obsMetadataPredictor
      variable: instantaneousAltitudeRate
      order: 2
  covariance: # TODO: all of this section needs revisiting by experts, this is copy-paste from amsua yaml
# work out separate specifications per predictor, needs more modification
    minimal required obs number: 3
    variance range: [1.0e-6, 1.0]
    step size: 1.0e-4
    largest analysis variance: 10000.0
    prior:
      input file: '{{cycle_dir}}/aircraft_temperature.{{background_time}}.acftbias_cov'
      inflation:
        ratio: 1.005
        ratio for small dataset: 2.0
# RTODLING: this needs attention: we must implement writer for cov parameters
#   output file: '{{cycle_dir}}/aircraft_temperature.{{window_begin}}.acftbias_cov'

obs operator:
  name: Composite
  components:

  - name: VertInterp
    observation alias file: '{{experiment_root}}/{{experiment_id}}/configuration/jedi/interfaces/{{model_component}}/observations/obsop_name_map.yaml'
    variables: [airTemperature]

linear obs operator:
  name: Composite
  components:

  - name: VertInterp
    observation alias file: '{{experiment_root}}/{{experiment_id}}/configuration/jedi/interfaces/{{model_component}}/observations/obsop_name_map.yaml'
    variables: [airTemperature]

obs filters:

# ------------------
# airTemperature BC
# ------------------

# Reassign any AIREP/PIREP (type=130) airTemperature MetaData/stationIdentification to 'KX130   '
- filter: Variable Assignment
  where:
  - variable:
      name: ObsType/airTemperature
    is_in: 130
  assignments:
  - name: MetaData/stationIdentification
    value: 'KX130   '
# Reassign any ascent predictor to zero where  MetaData/instantaneousAltitudeRate >50.
- filter: Variable Assignment
  where:
  - variable:
      name: MetaData/instantaneousAltitudeRate
    minvalue: 50.
  assignments:
  - name: MetaData/instantaneousAltitudeRate
    value: 0.

# ------------------
# airTemperature
# --------------

# Reject all obs with PreQC mark already set above 3 - checked, GMAO has noiqc=false so QC limit=4
# Input prepbufr without OIQC would not have QC marks 4-7 though ("global" assignment of obs error)
- filter: Perform Action
  filter variables:
  - name: airTemperature
  action:
    name: assign error
    error parameter: 2.0

# Assign the initial observation error, based on pressure (for AIREP/ACARS; itype=130)
- filter: Perform Action
  filter variables:
  - name: airTemperature
  action:
    name: assign error
    error function:
      name: ObsFunction/ObsErrorModelStepwiseLinear
      options:
        xvar:
          name: MetaData/pressure
        xvals: [100000, 95000, 90000, 85000, 80000]
        errors: [2.5, 2.3, 2.1, 1.9, 1.7]
  where:
  - variable:
      name: ObsType/airTemperature
    is_in: 130

# Assign the initial observation error, based on pressure (for AMDAR and MDCRS; itype=131,133)
- filter: Perform Action
  filter variables:
  - name: airTemperature
  action:
    name: assign error
    error function:
      name: ObsFunction/ObsErrorModelStepwiseLinear
      options:
        xvar:
          name: MetaData/pressure
        xvals: [100000, 95000, 90000, 85000, 80000]
        errors: [1.4706, 1.3529, 1.2353, 1.1176, 1.0]
  where:
  - variable:
      name: ObsType/airTemperature
    is_in: 131,133

# Assign the initial observation error, based on pressure (for RECON aircraft; itype=132)
- filter: Perform Action
  filter variables:
  - name: airTemperature
  action:
    name: assign error
    error function:
      name: ObsFunction/ObsErrorModelStepwiseLinear
      options:
        xvar:
          name: MetaData/pressure
        xvals: [105000, 100000, 95000, 90000, 85000, 70000, 65000, 60000, 40000, 35000, 30000, 25000, 20000, 5000]
        errors: [1.5,  1.3,    1.1,   0.9,   0.8,   0.8,   0.75,  0.7,   0.7,   0.75,  0.85,  1.3,   1.5,   1.5]
  where:
  - variable:
      name: ObsType/airTemperature
    is_in: 132

# Assign the initial observation error, based on pressure (for TAMDAR itype=134)
- filter: Perform Action
  filter variables:
  - name: airTemperature
  action:
    name: assign error
    error function:
      name: ObsFunction/ObsErrorModelStepwiseLinear
      options:
        xvar:
          name: MetaData/pressure
        xvals: [100000, 95000, 90000, 85000, 80000, 60000, 40000]
        errors: [1.5,   1.35,  1.25,  1.10,  1.0,   1.3,   1.7]
  where:
  - variable:
      name: ObsType/airTemperature
    is_in: 134

# Assign the initial observation error, based on pressure (for Canadian AMDAR itype=135)
- filter: Perform Action
  filter variables:
  - name: airTemperature
  action:
    name: assign error
    error function:
      name: ObsFunction/ObsErrorModelStepwiseLinear
      options:
        xvar:
          name: MetaData/pressure
        xvals: [100000, 95000, 90000, 85000, 80000]
        errors: [1.4706, 1.3529, 1.2353, 1.1176, 1000000000.0 ]
  where:
  - variable:
      name: ObsType/airTemperature
    is_in: 135

# When multiple obs exist within a single vertical model level, inflate ObsError
- filter: Perform Action
  filter variables:
  - name: airTemperature
  action:
    name: inflate error
    inflation variable:
      name: ObsFunction/ObsErrorFactorConventional
      options:
        test QCflag: PreQC
        inflate variables: [airTemperature]
        pressure: MetaData/pressure
        distance threshold: 60000.0
  defer to post: true

- filter: Perform Action
  filter variables:
  - name: airTemperature
  where:
  - variable: PreQC/airTemperature
    is_in: 4-15
  action:
    name: passivate
  defer to post: true

# TAMDAR and Canadian AMDAR are passive in GSI
- filter: Perform Action
  filter variables:
  - name: airTemperature
  where:
  - variable:
      name: ObsType/airTemperature
    is_in: 134, 135
  action:
    name: passivate
  defer to post: true

# Inflate kx130 error for obs below 500 if (aircraft_t_bc .and. kx==130 .and. ppb>=500.0_r_kind)
# toe=toe*r10
- filter: Perform Action
  action:
    name: inflate error
    inflation factor: 10.
  filter variables:
  - name: airTemperature
  where:
  - variable:
      name: MetaData/pressure
    maxvalue: 110000
    minvalue: 50000
  - variable:
      name: ObsType/airTemperature
    is_in: 130
  defer to post: true

# A temporary solution: Replace error by GsiAdjustObsError overwrite above error assignments and
# inflation.
- filter: Perform Action
  filter variables:
  - name: airTemperature
  action:
    name: assign error
    error function: GsiAdjustObsError/airTemperature
  where:
  - variable:
      name: GsiAdjustObsError/airTemperature
    value: is_valid
  defer to post: true

# error inflation based on pressure check
- filter: Perform Action
  filter variables:
  - name: airTemperature
  action:
    name: inflate error
    inflation variable:
      name: ObsFunction/ObsErrorFactorPressureCheck
      options:
        variable: airTemperature
        inflation factor: 8.0
        surface_obs: false
        adjusted_error_name: GsiAdjustObsError
        geovar_sfc_geomz: height_above_mean_sea_level_at_surface
  defer to post: true

