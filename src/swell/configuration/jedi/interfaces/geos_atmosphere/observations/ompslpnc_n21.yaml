obs space:
  name: OMPSLPNC N21
  obsdatain:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/ompslpnc_n21.{{window_begin}}.nc4'
      missing file action: warn
  obsdataout:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/{{experiment_id}}.ompslpnc_n21.{{window_begin}}.nc4'
  io pool:
    max pool size: 6
  simulated variables: [ozoneProfile]

obs operator:
  name: VertInterp
  vertical coordinate: air_pressure
  observation alias file: '{{experiment_root}}/{{experiment_id}}/configuration/jedi/interfaces/{{model_component}}/observations/obsop_name_map.yaml'

obs filters:
  # range sanity check
  - filter: Bounds Check
    filter variables:
    - name: ozoneProfile
    minvalue: 0
    maxvalue: 10000
    action:
      name: reject
  # threshold is really threshold*observation error (threshold= relative threshold)
  - filter: Background Check
    filter variables:
    - name: ozoneProfile
    threshold: 5.0
    action:
      name: reject
