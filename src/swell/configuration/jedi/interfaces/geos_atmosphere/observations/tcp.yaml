obs space:
  name: TC vital storm center pressure
  obsdatain:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/tcp.{{window_begin}}.nc4'
  obsdataout:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/{{experiment_id}}.tcp.{{window_begin}}.nc4'
  simulated variables: [stationPressure]

obs operator:
   # Surface pressure is handled using the correction scheme
  name: SfcPCorrected
  variables:
  - name: stationPressure
  da_psfc_scheme: GSI
  geovar_geomz: geopotential_height
  geovar_sfc_geomz: height_above_mean_sea_level_at_surface
  station_altitude: height


obs prior filters:

# Apply variable changes needed for rescaled height coordinate
# ------------------------------------------------------------
- filter: Variable Transforms
  Transform: AdjustedHeightCoordinate
  SkipWhenNoObs: False

obs post filters:

# ------------------
# stationPressure (surface pressure)
# ------------------
# PreUseFlag is assigned in reading programs in GSI.  (filled in as '1')
- filter: Perform Action
  filter variables:
  - name: stationPressure
  where:
  - variable: PreUseFlag/stationPressure
    # PreUseFlag should =< ijter ( # of outloop(0,1,2) + 1) in GSI
    minvalue: 1
  action:
    name: reject
# PrepBUFR check to be supplemented later  (filled in as '1')
- filter: RejectList
  where:
  - variable:
      name: PreQC/stationPressure
    is_in: 4-15
# error assignments
# Original error is not from error table
# error inflation based on Ps correction
#   tcp_refps=1000.0_r_kind
#   tcp_width=50.0_r_kind
#   tcp_ermin=0.75_r_kind
#   tcp_ermax=5.0_r_kind
#   psob=stormpsmin(i)      ! in mb
#   psdif=tcp_refps-psob    ! in mb
#   alpha=max(min(psdif/tcp_width,one),zero)
#   oberr=tcp_ermin+(tcp_ermax-tcp_ermin)*alpha

- filter: Perform Action
  filter variables:
  - name: stationPressure
  action:
    name: inflate error
    inflation variable:
      name: ObsFunction/ObsErrorFactorSfcPressure
      options:
        geovar_geomz: geopotential_height
        geovar_sfc_geomz: height_above_mean_sea_level_at_surface
        station_altitude: height
# assign TempObsErrorData/stationPressure <--- ObsErrorData before changing its Min and Max
- filter: Variable Assignment
  assignments:
  - name: TempObsErrorData/stationPressure
    type: float
    function:
      name: ObsFunction/Arithmetic
      options:
        variables:
        - name: ObsErrorData/stationPressure
  defer to post: true
# tcp      112    0    1     3.0      0      0      0  75.0   5.0   1.0  75.0  0.000000     0    0.     0.      0    0.     0.
# set ObsErrorData 100 Pa if it < 100 Pa.
- filter: Perform Action
  filter variables:
  - name: stationPressure
  action:
    name: assign error
    error parameter: 100
  where:
  - variable:
      name: TempObsErrorData/stationPressure
    maxvalue: 100
  - variable:
      name: TempObsErrorData/stationPressure
    value: is_valid
  defer to post: true
# set ObsErrorData 500 Pa if it > 500 Pa.
- filter: Perform Action
  filter variables:
  - name: stationPressure
  action:
    name: assign error
    error parameter: 500
  where:
  - variable:
      name: TempObsErrorData/stationPressure
    minvalue: 500
  - variable:
      name: TempObsErrorData/stationPressure
    value: is_valid
  defer to post: true
# Background  check
# background check for obstype 112
# threshold 75.0 if PreQC /= 3
- filter: Background Check
  filter variables:
  - name: stationPressure
  threshold: 75.0
  action:
    name: reject
  where:
  - variable: PreQC/stationPressure
    is_not_in: [3]
  - variable: ObsType/stationPressure
    is_in: 180,183
  defer to post: true
#?? threshold * 0.7 if PreQC=3
#- filter: Background Check
#  filter variables:
#  - name: stationPressure
#  threshold: 2.8
#  action:
#    name: reject
#  where:
#  - variable: PreQC/stationPressure
#    is_in: [3]
#  - variable: ObsType/stationPressure
#    is_in: 180,183
#  defer to post: true
# Re-assign error ObsErrorData/stationPressure <--- TempObsErrorData/stationPressure
- filter: Perform Action
  filter variables:
  - name: stationPressure
  action:
    name: assign error
    error function: TempObsErrorData/stationPressure
  where:
  - variable:
      name: TempObsErrorData/stationPressure
    value: is_valid
  defer to post: true
# # No duplicate check


