cycle_times:
  default_value: ['T00', 'T06', 'T12', 'T18']
  options: ['T00', 'T06', 'T12', 'T18']

ensemble_hofx_strategy:
  default_value: 'serial'

ensemble_hofx_packets:
  default_value: 1

saber_central_block:
  default_value: bump_nicas
  options:
  - identity
  - bump_nicas

saber_outer_block:
  default_value: stddev_bkg_scaled
  options:
  - stddev_bkg_scaled
  - stddev_fixed_values

stddev_scale_factors:
  default_value:
    volume_mixing_ratio_of_o3: 0.25
    volume_mixing_ratio_of_no2: 0.25
    volume_mixing_ratio_of_co: 0.25

skip_ensemble_hofx:
  default_value: true
