# TEMPO NO2 Tropospheric Column L2 — IODA converter configuration
# Converter: tempo_nc2ioda.py (must be available in `converter_path` or
#            in jedi_bundle/build/bin/)
#
# Invocation (one call per cycle, all granules passed together):
#   python3 <jedi_bundle>/build/bin/tempo_nc2ioda.py
#       -i <granule1.nc> <granule2.nc> ...
#       -o <cycle_dir>/ioda/tempo_no2_tropo/tempo_no2_tropo_YYYYMMDDHH.nc
#       -c troposphere
#       -v no2

# Name of the ioda-converters Python script.
converter_script: tempo_nc2ioda.py

# Output filename template (must match `source` in ingest_observations/tempo_no2_tropo.yaml).
output_filename_template: "tempo_no2_tropo_%Y%m%d%H.nc"

# Additional flags passed verbatim to the converter after -i and -o.
extra_flags:
  -c: troposphere   # retrieval layer: troposphere column
  -v: no2           # variable: nitrogen dioxide
