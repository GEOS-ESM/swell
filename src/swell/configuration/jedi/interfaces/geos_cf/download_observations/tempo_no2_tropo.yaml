# TEMPO NO2 Tropospheric Column L2 — download configuration
# Instrument: TEMPO (Tropospheric Emissions: Monitoring of Pollution)
# Product:    TEMPO_NO2_L2 V03 (NRT)
# Source:     NASA ASDC S3 bucket via Earthdata Cumulus
#             (Earthdata authentication required in ~/.netrc for
#              urs.earthdata.nasa.gov)
#
# Files are named:
#   TEMPO_NO2_L2_V03_YYYYMMDDTHHMMSSz_YYYYMMDDTHHMMSSz_S<scan>G<granule>.nc
# where field 4 (0-based, split on '_') is the granule start timestamp.
#
# Available versions:
#   V03 (NRT):     s3://asdc-prod-protected/TEMPO/TEMPO_NO2_L2_V03/YYYY.MM.DD
#   V04 (current): s3://asdc-prod-protected/TEMPO/TEMPO_NO2_L2_V04/YYYY.MM.DD
# Change s3_source below to switch versions.

retrieval_method: s3_secure

# S3 URI template — YYYY, MM, DD are resolved at runtime.
s3_source: "s3://asdc-prod-protected/TEMPO/TEMPO_NO2_L2_V03/YYYY.MM.DD"

# Index (0-based) of the start-time token in the filename when split on '_'.
# TEMPO_NO2_L2_V03_20231015T180000Z_... → field 4 = '20231015T180000Z'
filename_datetime_field: 4

# strptime format for the start-time token above.
filename_datetime_format: "%Y%m%dT%H%M%SZ"

# Maximum duration of a single TEMPO scan granule. Used to extend the file
# search window backwards so that granules starting before window_begin but
# containing data within the DA window are not missed.
# TEMPO scans roughly one hemisphere per hour; PT2H provides a safe margin.
max_orbit_duration: PT2H
