obs space:
  name: omps_o3_nm_total
  obsdatain:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/omps_o3_nm_total.{{window_begin}}.nc4'
  obsdataout:
    engine:
      type: H5File
      allow overwrite: true
      obsfile: '{{cycle_dir}}/{{experiment_id}}.omps_o3_nm_total.{{window_begin}}.nc4'
  simulated variables: [ozoneTotal]

obs error:
  covariance model: diagonal

obs filters:
# Reject non-positive total ozone (toz > 0)
- filter: Bounds Check
  filter variables:
  - name: ozoneTotal
  minvalue: 0.0
# Reject non-positive a priori term (apriori(1,...) > 0)
- filter: RejectList
  filter variables:
  - name: ozoneTotal
  where:
  - variable:
      name: RetrievalAncillaryData/aprioriTerm
    maxvalue: 0.0
# Reject where lower 4 bits of quality flags are set (mod(qf,16) == 0)
- filter: RejectList
  filter variables:
  - name: ozoneTotal
  where:
  - variable:
      name: MetaData/qualityFlags
    any_bit_set_of: 0-3
# Reject where bit 8 of ground pixel quality flags is unset (iand(gpqf,256) != 0)
- filter: RejectList
  filter variables:
  - name: ozoneTotal
  where:
  - variable:
      name: MetaData/groundPixelQualityFlags
    any_bit_unset_of: 8

obs operator:
  name: ColumnRetrieval
  nlayers_retrieval: 11
  tracer variables: [volume_mixing_ratio_of_o3]
  isApriori: true
  isAveragingKernel: true
  stretchVertices: topbottom #options: top, bottom, topbottom, none
