obs space:
  name: tempo_no2_total
  obsdatain:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/tempo_no2_total.{{window_begin}}.nc4'
  obsdataout:
    engine:
      type: H5File
      allow overwrite: true
      obsfile: '{{cycle_dir}}/{{experiment_id}}.tempo_no2_total.{{window_begin}}.nc4'
  #_source: nasa
  #_source: tempo_demo
  #_source: nasa_VCD
  #_source: tempo_slant_col
  simulated variables: [nitrogendioxideTotal]
  observed variables: [nitrogendioxideTotal]
monitoring only: false

obs filters:
- filter: RejectList
  where:
    - variable:
        name: MetaData/cloudAmount
      minvalue: 0.15 # reject var with cf>0.001

- filter: RejectList
  where:
    - variable:
        name: MetaData/solarZenithAngle
      minvalue: 70

obs operator:
  name: ColumnRetrieval
  nlayers_retrieval: 72
  tracer variables: [volume_mixing_ratio_of_no2]
  isApriori: false
  isAveragingKernel: true
  stretchVertices: topbottom #options: top, bottom, topbottom, none
  #tropopause pressure: 30000.0 #Pa #remove for no ufo hack?
