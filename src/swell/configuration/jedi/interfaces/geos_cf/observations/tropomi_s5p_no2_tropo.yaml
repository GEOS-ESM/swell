obs space:
  name: tropomi_s5p_no2_tropo
  obsdatain:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/tropomi_s5p_no2_tropo.{{window_begin}}.nc4'
  obsdataout:
    engine:
      type: H5File
      allow overwrite: true
      obsfile: '{{cycle_dir}}/{{experiment_id}}.tropomi_s5p_no2_tropo.{{window_begin}}.nc4'
  #_source: esa
  #_source: compo_exp
  #_source: tempo_demo
  simulated variables: [nitrogendioxideColumn]
  observed variables: [nitrogendioxideColumn]

#obs filters:
#- filter: Bounds Check
#  filter variables:
#  - name: nitrogendioxideColumn
#  minvalue: 0

obs filters:
- filter: Domain Check
  filter variables:
  - name: nitrogendioxideColumn
  where:
  - variable:
      name: MetaData/latitude
    minvalue: -65
    maxvalue: 65

obs operator:
  name: ColumnRetrieval
  nlayers_retrieval: 34
  tracer variables: [volume_mixing_ratio_of_no2]
  isApriori: false
  isAveragingKernel: true
  stretchVertices: topbottom #options: top, bottom, topbottom, none
