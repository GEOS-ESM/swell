obs space:
  name: tempo_no2_tropo
  obsdatain:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/tempo_no2_tropo.{{window_begin}}.nc4'
  obsdataout:
    engine:
      type: H5File
      allow overwrite: true
      obsfile: '{{cycle_dir}}/{{experiment_id}}.tempo_no2_tropo.{{window_begin}}.nc4'
  simulated variables: [nitrogendioxideColumn]
  observed variables: [nitrogendioxideColumn]
monitoring only: false

obs filters:
- filter: RejectList
  where:
    - variable:
        name: MetaData/cloud_fraction
      minvalue: 0.15 # reject var with cf>0.001

- filter: RejectList
  where:
    - variable:
        name: MetaData/solar_zenith_angle
      minvalue: 70

obs operator:
  name: ColumnRetrieval
  nlayers_retrieval: 72
  tracer variables: [volume_mixing_ratio_of_no2]
  isApriori: false
  isAveragingKernel: true
  stretchVertices: topbottom #options: top, bottom, topbottom, none
