# WOUDC ozonesondes (converted with woudc_ozonesonde2ioda.py).
# For HofX and monitoring only: `monitoring only: true` keeps these data out of
# the cost function even if this observation is added to a variational suite.
obs space:
  name: ozonesonde
  obsdatain:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/ozonesonde.{{window_begin}}.nc4'
    # One record per sonde flight, levels from the surface upwards
    obsgrouping:
      group variables: [stationIdentification, releaseTime]
      sort variable: pressure
      sort order: descending
  obsdataout:
    engine:
      type: H5File
      allow overwrite: true
      obsfile: '{{cycle_dir}}/{{experiment_id}}.ozonesonde.{{window_begin}}.nc4'
  simulated variables: [ozoneInsitu]
  observed variables: [ozoneInsitu]
monitoring only: true

obs filters:
# Keep levels between the model surface and 5 hPa
- filter: Domain Check
  filter variables:
  - name: ozoneInsitu
  where:
  - variable:
      name: MetaData/pressure
    minvalue: 500.0
- filter: Difference Check
  filter variables:
  - name: ozoneInsitu
  reference: GeoVaLs/air_pressure_at_surface
  value: MetaData/pressure
  maxvalue: 0.0
# Gross background check: reject |O - B| > threshold * ObsError
- filter: Background Check
  filter variables:
  - name: ozoneInsitu
  threshold: 10.0

obs operator:
  name: VertInterp
  variable maps:
  - name: ozoneInsitu
    alias: volume_mixing_ratio_of_o3
  vertical coordinate: air_pressure
  observation vertical coordinate: pressure
  observation vertical coordinate group: MetaData
  interpolation method: log-linear
