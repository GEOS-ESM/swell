obs space:
  name: tropomi_s5p_co_total
  obsdatain:
    engine:
      type: H5File
      obsfile: '{{cycle_dir}}/tropomi_s5p_co_total.{{window_begin}}.nc4'
  obsdataout:
    engine:
      type: H5File
      allow overwrite: true
      obsfile: '{{cycle_dir}}/{{experiment_id}}.tropomi_s5p_co_total.{{window_begin}}.nc4'
  simulated variables: [carbonmonoxideTotal]
  observed variables: [carbonmonoxideTotal]

obs filters:
- filter: Bounds Check
  filter variables:
  - name: carbonmonoxideTotal
  minvalue: 0
- filter: Domain Check
  filter variables:
  - name: carbonmonoxideTotal
  where:
  - variable:
      name: MetaData/latitude
    minvalue: -65
    maxvalue: 65
- filter: Bounds Check
  filter variables:
  - name: carbonmonoxideTotal
  test variables:
  - name: RetrievalAncillaryData/averagingKernel
    layers: 1-50
  minvalue: -1.0
  maxvalue: 2.0
  flag all filter variables if any test variable is out of bounds: true

obs operator:
  name: ColumnRetrieval
  nlayers_retrieval: 50
  tracer variables: [volume_mixing_ratio_of_co]
  isApriori: false
  isAveragingKernel: true
  stretchVertices: topbottom #options: top, bottom, topbottom, none
