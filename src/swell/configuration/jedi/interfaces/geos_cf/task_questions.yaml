# What is the duration from the middle of the window when forecasts start?
analysis_forecast_window_offset:
  default_value: -PT3H
  options:
  - -PT3H

analysis_variables:
  default_value:
  - volume_mixing_ratio_of_no2
  options:
  - volume_mixing_ratio_of_no2

background_experiment:
  default_value: 54bbb4
  options:
  - 54bbb4

background_frequency:
  default_value: PT1H


# How long before the middle of the analysis window did
# the background providing forecast begin?

background_time_offset:
  default_value: PT9H

clean_patterns:
  default_value:
  - '*.nc4'
  - '*.txt'
  - logfile.*.out
  options:
  - '*.nc4'
  - '*.txt'
  - logfile.*.out

npx_proc:
  default_value: 2

npy_proc:
  default_value: 2

number_of_iterations:
  default_value:
  - 5

obs_provider:
  default_value: 
  - nasa_VCD
  options:
  - nasa_VCD
  - tempo_demo

observations:
  default_value: 
  - tempo_no2_tropo
  - tempo_no2_total
  options: 
  - tempo_no2_tropo
  - tropomi_s5p_no2_tropo
  - tempo_no2_total

observing_system_records_path:
  default_value: None

vertical_resolution:
  default_value: '72'
  options:
  - '72'

window_length:
  default_value: PT6H

window_offset:
  default_value: PT3H

window_type:
  default_value: 3D
